<script>
const SUPABASE_URL = 'https://yxmirhpwmdmaxynlshdx.supabase.co'
// BIZPORTAL-JWT-1: la clave antigua se va. Se usa la publicable de mas abajo.
const MAPBOX_TOKEN = 'pk.eyJ1IjoibW90b2NsdWJlcyIsImEiOiJjbXA2cmJxaTUwM3djMnJzZXlvMzBycGg0In0.dw_0jtLStDE_MyCAm6zOig'
// SEG7-FOTOS-25AGO: el cliente de Storage va con la clave PUBLICABLE, no con la
// antigua. Storage es API REST, y las claves antiguas estan DESACTIVADAS
// ("Legacy API keys are disabled"): con la vieja, subir una foto no podia funcionar
// -- y el bucket business-photos tenia 0 objetos, que es justo lo que se esperaria.
// OJO: el resto de la pagina (helper api()) sigue con SUPABASE_PUBLISHABLE_KEY A PROPOSITO.
// Las Edge Functions SI aceptan la vieja y van con verify_jwt=false; se cambia una
// cosa cada vez para que la medida signifique algo.
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_qfrmrp5BiNcg1U0gFtA78w_oRAMGzDi'
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)

// MC-BIZPORTAL-25AGO-2026: puerta unica. El business_id ya no vive en el navegador.
const session = JSON.parse(localStorage.getItem('business_session') || 'null')
if (!session || !session.token) { localStorage.removeItem('business_session'); window.location.href = 'login.html' }

async function api(action, payload = {}) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/business-portal`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_PUBLISHABLE_KEY,
      'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
      'x-business-token': session.token
    },
    body: JSON.stringify({ action, payload })
  })
  const data = await res.json().catch(() => ({}))
  if (res.status === 401) { localStorage.removeItem('business_session'); window.location.href = 'login.html'; throw new Error('sesion caducada') }
  if (!res.ok || data.error) throw new Error(data.error || 'Error de conexion')
  return data
}

async function handleLogout() {
  try { await api('logout') } catch (e) {}
  localStorage.removeItem('business_session')
  window.location.href = 'login.html'
}

let currentLat = 40.4168, currentLng = -3.7038
let photos = [], selectedType = '', map, marker, biz
// MC-RF-HOTEL-1OCT-2026 (92.ª): habitaciones, lo del hotel entero y lo pendiente de revisión.
let habitaciones = [], alojamiento = null, cambios = []

// ---- MC-RF-ROBLE-30SEP-2026 (89.ª, RF-HORARIO-DIAS-1 · diseño de Mario) ----
// Cada día «Abro / Cerrado» con mediodía y noche; «Mismo horario todos los días que abro»;
// festivos como un domingo, cerrado u otro horario. Sustituye a apertura/cierre (una sola franja).
let horario = null
function iniciarHorario(b) {
  if (b.horario && b.horario.dias) horario = JSON.parse(JSON.stringify(b.horario))
  else {
    // Primera vez: lo que tuviera en apertura/cierre, todos los días, como punto de partida.
    const t = b.opening_time && b.closing_time ? [[b.opening_time.slice(0, 5), b.closing_time.slice(0, 5)]] : []
    horario = { mismo: true, dias: {}, festivos: { modo: 'domingo' } }
    MC_DIAS.forEach(d => { horario.dias[d.k] = { abre: t.length > 0, turnos: t.map(x => [...x]) } })
  }
  horario.festivos = horario.festivos || { modo: 'domingo' }
  document.getElementById('h-mismo').checked = !!horario.mismo
  document.getElementById('h-mismo').addEventListener('change', (e) => {
    horario.mismo = e.target.checked
    if (horario.mismo) { const base = turnosComunes(); MC_DIAS.forEach(d => { if (horario.dias[d.k].abre) horario.dias[d.k].turnos = base.map(x => [...x]) }) }
    pintarHorario()
  })
  pintarHorario()
}
function turnosComunes() {
  const d = MC_DIAS.map(x => horario.dias[x.k]).find(x => x && x.abre && (x.turnos || []).length)
  return d ? d.turnos : []
}
// Dos franjas fijas en pantalla: [0] mediodía, [1] noche. Vacías = ese turno no abre.
function franjasHtml(turnos, pref) {
  const t = turnos || []
  const f = (i, nombre) => `<div class="hfranja">${nombre} <input type="time" data-f="${pref}" data-i="${i}" data-j="0" value="${(t[i] || [])[0] || ''}"> a <input type="time" data-f="${pref}" data-i="${i}" data-j="1" value="${(t[i] || [])[1] || ''}"></div>`
  return f(0, 'Mediodía') + f(1, 'Noche')
}
function leerFranjas(pref) {
  const v = (i, j) => (document.querySelector(`input[data-f="${pref}"][data-i="${i}"][data-j="${j}"]`) || {}).value || ''
  return [0, 1].map(i => [v(i, 0), v(i, 1)]).filter(x => x[0] && x[1])
}
function pintarHorario() {
  const comun = document.getElementById('h-comun')
  comun.innerHTML = horario.mismo ? `<div class="hdia"><div class="hdia-nombre">Horario</div><div class="hfranjas" style="padding-left:0">${franjasHtml(turnosComunes(), 'comun')}</div></div>` : ''
  document.getElementById('h-dias').innerHTML = MC_DIAS.map(d => {
    const x = horario.dias[d.k] || { abre: false }
    return `<div class="hdia"><div class="hdia-nombre">${d.l}</div>
      <div class="rf-chips"><button type="button" class="rf-chip${x.abre ? ' sel' : ''}" onclick="abreDia('${d.k}',true)">Abro</button><button type="button" class="rf-chip${x.abre ? '' : ' sel'}" onclick="abreDia('${d.k}',false)">Cerrado</button></div>
      ${x.abre && !horario.mismo ? `<div class="hfranjas">${franjasHtml(x.turnos, d.k)}</div>` : ''}</div>`
  }).join('')
  const modos = [['domingo', 'Como un domingo'], ['cerrado', 'Cerrado'], ['otro', 'Otro horario']]
  document.getElementById('h-fest').innerHTML = modos.map(([k, l]) =>
    `<button type="button" class="rf-chip${horario.festivos.modo === k ? ' sel' : ''}" onclick="modoFestivo('${k}')">${l}</button>`).join('')
  document.getElementById('h-fest-franjas').innerHTML = horario.festivos.modo === 'otro' ? franjasHtml(horario.festivos.turnos, 'fest') : ''
  document.querySelectorAll('input[data-f]').forEach(i => i.addEventListener('input', leerHorario))
  pintarPrevia()
}
function leerHorario() {
  if (horario.mismo) {
    const t = leerFranjas('comun')
    MC_DIAS.forEach(d => { if (horario.dias[d.k].abre) horario.dias[d.k].turnos = t.map(x => [...x]) })
  } else {
    MC_DIAS.forEach(d => { if (horario.dias[d.k].abre && document.querySelector(`input[data-f="${d.k}"]`)) horario.dias[d.k].turnos = leerFranjas(d.k) })
  }
  if (horario.festivos.modo === 'otro') horario.festivos.turnos = leerFranjas('fest')
  pintarPrevia()
}
window.abreDia = function (k, abre) {
  leerHorario()
  horario.dias[k] = { abre, turnos: abre ? (horario.mismo ? turnosComunes() : (horario.dias[k].turnos || [])).map(x => [...x]) : [] }
  pintarHorario()
}
window.modoFestivo = function (m) { leerHorario(); horario.festivos = { modo: m, turnos: m === 'otro' ? (horario.festivos.turnos || []) : undefined }; pintarHorario() }
// Lo que se guarda: un día «Abro» sin ninguna franja no dice nada al motero; se avisa antes.
function horarioParaGuardar() {
  leerHorario()
  const sinHora = MC_DIAS.filter(d => horario.dias[d.k].abre && !(horario.dias[d.k].turnos || []).length).map(d => d.l)
  if (sinHora.length) throw new Error('pon la hora de ' + sinHora.join(', ') + ' (o márcalo como Cerrado)')

document.getElementById('carta-input').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = ''
  if (!file || cartaSubiendo === null) return
  const i = cartaSubiendo; cartaSubiendo = null
  try {
    const esPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')
    const r = esPdf ? { blob: file, ext: 'pdf' } : await reducirFoto(file)
    if (r.blob.size > 10 * 1024 * 1024) throw new Error('pesa más de 10 MB')
    const slot = await api('photo_slot', { ext: r.ext })
    const { error } = await sbClient.storage.from('business-photos')
      .uploadToSignedUrl(slot.path, slot.token, r.blob, { contentType: esPdf ? 'application/pdf' : (r.blob.type || 'image/jpeg') })
    if (error) throw new Error(error.message)
    cartas[i].url = slot.public_url
    if (!cartas[i].nombre) cartas[i].nombre = esPdf ? 'Carta' : 'Menú'
    pintarCartas()
  } catch (err) { alert('No se pudo subir ' + file.name + ': ' + err.message) }
})
function cartasParaGuardar() {
  const sinNombre = cartas.filter(c => c.url && !String(c.nombre || '').trim())
  if (sinNombre.length) throw new Error('ponle nombre a cada carta o menú')
  return cartas.filter(c => c.url).map(c => ({ nombre: String(c.nombre).trim(), url: c.url, precio: c.precio }))
}
function pintarPrevia() {
  const hoy = document.getElementById('preview-hoy'); const ca = document.getElementById('preview-carta')
  if (hoy) hoy.textContent = horario ? mcHorarioHoy(horario) : ''
  const c = cartas.find(x => x.url && String(x.nombre || '').trim())

  // MC-PORTAL-BUSCADOR-21SEP-2026: el campo de dirección era un buscador a ciegas — solo

  const inDir = document.getElementById('f-address')

  inDir.setAttribute('autocomplete', 'off')
  inDir.addEventListener('input', () => {
    clearTimeout(tDir)
    const q = inDir.value.trim()
    if (q.length < 3) return cerrarSug()
    tDir = setTimeout(async () => {
      const yo = ++pedido
      try {
        const url = `https://api.mapbox.com/search/geocode/v6/forward?q=${encodeURIComponent(q)}` +
          `&country=es,fr,pt,ad&language=es&limit=6&autocomplete=true` +
          `&types=address,street,place,locality,neighborhood,postcode&access_token=${MAPBOX_TOKEN}`
        const j = await (await fetch(url)).json()
        if (yo !== pedido) return   // llegó tarde: ya se escribió otra cosa
        const feats = (j.features || [])
        if (!feats.length) { sug.innerHTML = '<div class="dir-sug-vacio">Sin resultados. Coloca el pin a mano en el mapa.</div>'; sug.style.display = 'block'; return }
        sug.innerHTML = feats.map((f, i) => {
          const p = f.properties || {}
          return `<button type="button" class="dir-sug-item" data-i="${i}"><b>${esc(p.name || '')}</b><span>${esc(p.place_formatted || '')}</span></button>`
        }).join('')
        sug.style.display = 'block'
        sug.querySelectorAll('.dir-sug-item').forEach(b => b.addEventListener('click', () => {
          const f = feats[Number(b.dataset.i)]
          const [lng, lat] = f.geometry.coordinates
          const p = f.properties || {}
          inDir.value = p.full_address || [p.name, p.place_formatted].filter(Boolean).join(', ')
          currentLat = lat; currentLng = lng
          const fino = ['address', 'street', 'poi'].includes(p.feature_type)
          map.flyTo({ center: [lng, lat], zoom: fino ? 17 : 14 })
          marker.setLngLat([lng, lat])
          cerrarSug()
        }))
      } catch (e) { cerrarSug() }
    }, 300)
  })
  inDir.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarSug() })
  document.addEventListener('click', e => { if (e.target !== inDir && !sug.contains(e.target)) cerrarSug() })

  mapboxgl.accessToken = MAPBOX_TOKEN
  map = new mapboxgl.Map({ container: 'map', style: 'mapbox://styles/mapbox/streets-v12', center: [currentLng, currentLat], zoom: biz.lat ? 16 : 5 })
  marker = new mapboxgl.Marker({ color: '#FF7A1A', draggable: true }).setLngLat([currentLng, currentLat]).addTo(map)
  marker.on('dragend', () => { const pos = marker.getLngLat(); currentLat = pos.lat; currentLng = pos.lng })
  // MC-PORTAL-MAPA-21SEP-2026 (Mario, 21-sep: «el mapa no sirve de nada como está hecho»):
  // era un recuadro de 220 px sin botones y el pin solo se podía arrastrar; si se perdía de
  // vista no había forma de volver. Ahora: más alto, acercar/alejar, pantalla completa,

  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right')
  map.addControl(new mapboxgl.FullscreenControl(), 'top-right')
  map.on('click', e => {
    currentLat = e.lngLat.lat; currentLng = e.lngLat.lng

  })
  let satelite = false
  document.getElementById('btn-satelite').addEventListener('click', () => {

    map.setStyle(satelite ? 'mapbox://styles/mapbox/satellite-streets-v12' : 'mapbox://styles/mapbox/streets-v12')
    document.getElementById('btn-satelite').textContent = satelite ? 'Ver callejero' : 'Ver satélite'
    document.getElementById('btn-satelite').classList.toggle('sel', satelite)

  document.getElementById('btn-al-pin').addEventListener('click', () => {
    map.flyTo({ center: [currentLng, currentLat], zoom: Math.max(map.getZoom(), 16) })

function renderPhotos() {
  const grid = document.getElementById('photos-grid')
  if (!grid) return
  let html = ''
  for (let i = 0; i < 5; i++) {
    if (photos[i]) {
      html += `<div class="photo-slot filled ${i===0?'main-slot':''}"><img src="${photos[i]}" alt="Foto ${i+1}"><button class="photo-delete" onclick="removePhoto(${i})">✕</button></div>`
    } else if (i === 0 || photos.length >= i) {
      html += `<div class="photo-slot empty ${i===0?'main-slot':''}" onclick="triggerUpload(${i})"><span class="slot-icon">${i===0?'📸':'+'}</span><span class="slot-label">${i===0?'Portada':'Foto '+(i+1)}</span></div>`
    }
  }
  grid.innerHTML = html
  const previewImg = document.getElementById('preview-img')
  // FOTOS-3 (25-ago-2026): esto era `if (photos[0] && previewImg)`, o sea SOLO sabia
  // pintar. Al borrar la ultima foto no entraba en el if y la vista previa se
  // quedaba con la anterior pegada: la cuadricula decia "no hay fotos" y la previa
  // seguia ensenando una. Ahora el else limpia.
  if (previewImg) {
    if (photos[0]) {
      previewImg.style.backgroundImage = `url(${photos[0]})`
      previewImg.style.backgroundSize = 'cover'
      previewImg.style.backgroundPosition = 'center'
    } else {
      previewImg.style.backgroundImage = ''
    }
  }
}

// SEG7-FOTOS-REDUCIR-25AGO: antes se RECHAZABA toda foto de mas de 2 MB. Ese tope
// era de esta pagina, no del bucket (business-photos va sin file_size_limit), y
// cualquier foto de movil lo pasa: el portal era inusable con un telefono. Nadie lo
// vio porque nadie lo uso (0 objetos en el bucket).
// Ahora no se rechaza: se REDUCE aqui antes de subir. Un directorio no necesita
// 4000 px, y asi el rider tampoco se traga los megas al pintar el negocio.
// Medido con la primera foto real (25-ago): a 1600/0.82 salio de 1.377 KB, demasiado
// para que lo descargue un rider con datos moviles. Un directorio no necesita mas.
const FOTO_LADO_MAX = 1280
const FOTO_CALIDAD = 0.75

async function reducirFoto(file) {
  // Si no es imagen o el navegador no sabe decodificarla, se sube tal cual.
  if (!file.type.startsWith('image/')) return { blob: file, ext: (file.name.split('.').pop() || 'jpg'), reducida: false, motivo: 'no es imagen' }
  try {
    const bitmap = await createImageBitmap(file)
    const escala = Math.min(1, FOTO_LADO_MAX / Math.max(bitmap.width, bitmap.height))
    const w = Math.round(bitmap.width * escala)
    const h = Math.round(bitmap.height * escala)
    const lienzo = document.createElement('canvas')
    lienzo.width = w; lienzo.height = h
    lienzo.getContext('2d').drawImage(bitmap, 0, 0, w, h)
    const blob = await new Promise(r => lienzo.toBlob(r, 'image/jpeg', FOTO_CALIDAD))
    bitmap.close && bitmap.close()
    if (!blob) throw new Error('toBlob vacio')
    // Si reducir no ha servido de nada (ya era pequena y comprimida), gana la original.
    if (blob.size >= file.size) return { blob: file, ext: (file.name.split('.').pop() || 'jpg'), w, h, reducida: false, motivo: 'reducir no bajaba el peso' }
    return { blob, ext: 'jpg', w, h, reducida: true }
  } catch (err) {
    console.warn('[fotos] no se pudo reducir, se sube la original:', err)
    return { blob: file, ext: (file.name.split('.').pop() || 'jpg'), reducida: false, motivo: String(err && err.message || err) }
  }
}

document.getElementById('file-input').addEventListener('change', async e => {
  const files = Array.from(e.target.files)
  for (const file of files) {
    try {
      const r = await reducirFoto(file)
      const { blob, ext } = r
      // Red de seguridad: si aun asi es enorme, no se sube a ciegas.
      if (blob.size > 8 * 1024 * 1024) throw new Error('la foto sigue pesando ' + Math.round(blob.size / 1048576) + ' MB despues de reducirla')
      // El servidor decide la ruta y firma la subida: la foto nace con dueno.
      const slot = await api('photo_slot', { ext })
      const { error } = await sbClient.storage.from('business-photos')
        .uploadToSignedUrl(slot.path, slot.token, blob, { contentType: blob.type || 'image/jpeg' })
      if (error) throw new Error(error.message)
      if (photos.length < 5) photos.push(slot.public_url)
      renderPhotos()
      // El veredicto se PINTA. En un movil no hay consola que mirar.
      const hint = document.getElementById('foto-hint')
      if (hint) {
        hint.innerHTML = r.reducida
          ? 'Subida: ' + Math.round(file.size/1024) + ' KB → <b>' + Math.round(blob.size/1024) + ' KB</b>'
          : 'Subida sin reducir (' + (r.motivo || 'sin motivo') + ')'
      }
    } catch (err) {
      alert('No se pudo subir ' + file.name + ': ' + err.message)
    }
  }
  e.target.value = ''
})

// MC-PORTAL-SUCIO-21SEP-2026 (Mario: «si no he hecho ningún cambio, no debería quedar naranja»).
// El botón va gris y sin poder pulsarse mientras la ficha es igual a lo guardado, y naranja en
// cuanto algo cambia: textos, tipo, casillas, pin del mapa o fotos. Se compara una «foto» del
// formulario, cada medio segundo: así entra TODO lo que cambie, venga de donde venga.
let guardado = null
function fotoFormulario() {
  const v = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : '' }
  return JSON.stringify({
    n: v('f-name'), t: selectedType, c: v('f-cat'), o: v('f-otros'), d: v('f-desc'), p: v('f-phone'),
    w: v('f-web'), a: v('f-address'), h: horario, ca: cartas.filter(c => c.url),
    s: [...document.querySelectorAll('.f-serv:checked')].map(c => c.value).sort(),
    la: Number(currentLat).toFixed(6), ln: Number(currentLng).toFixed(6), f: photos,
    al: selectedType === 'hotel' ? leerAlojamiento() : null,
    hb: selectedType === 'hotel' ? habitaciones.map(habFoto) : null,
  })
}
function refrescarBoton() {
  const btn = document.getElementById('btn-save')
  if (!btn || !document.getElementById('f-name') || btn.dataset.guardando) return
  if (guardado === null) guardado = fotoFormulario()
  const hay = fotoFormulario() !== guardado
  btn.disabled = !hay
  btn.classList.toggle('sin-cambios', !hay)
  btn.textContent = hay ? 'Guardar cambios' : 'Sin cambios'
}
setInterval(refrescarBoton, 500)

window.addEventListener('beforeunload', (e) => {

function turnosDeLaSemana() {
  const d = MC_DIAS.map(x => horario.dias[x.k]).find(x => x && x.abre && (x.turnos || []).length)
  return d ? d.turnos : []
}

async function handleSave() {
  const btn = document.getElementById('btn-save')
  const alertError = document.getElementById('alert-error')
  const alertSuccess = document.getElementById('alert-success')
  alertError.classList.remove('show'); alertSuccess.classList.remove('show')

  const name = document.getElementById('f-name').value.trim()
  if (!name) { alertError.textContent = 'El nombre del negocio es obligatorio.'; alertError.classList.add('show'); window.scrollTo(0,0); return }

  btn.disabled = true; btn.dataset.guardando = '1'; btn.innerHTML = '<div class="spinner"></div> Guardando...'
  const loQueSeGuarda = fotoFormulario()

  try {
    if (!selectedType) throw new Error('elige qué tipo de negocio es')
    // MC-RF-HOTEL-1OCT-2026: las habitaciones se comprueban ANTES de guardar nada.
    const habsAGuardar = selectedType === 'hotel' ? habitaciones.filter(h => !h.id || habFoto(h) !== h._orig)
      .filter(h => h.tipo || h.bano || h.personas || h.cuantas || h.precio_desde || h.fotos.length) : []
    for (const h of habsAGuardar) {
      const n = 'en la habitación ' + (habitaciones.indexOf(h) + 1)
      if (!h.tipo) throw new Error('falta elegir el tipo ' + n)
      if (!h.bano) throw new Error('falta decir si el baño está dentro o es compartido ' + n)
      if (!(Number(h.personas) >= 1)) throw new Error('falta cuántas personas caben ' + n)
      if (!(Number(h.cuantas) >= 1)) throw new Error('falta cuántas habitaciones de ese tipo tenéis ' + n)
    }
    const rf = await api('profile_update', {
      name, type: selectedType,
      category: document.getElementById('f-cat').value.trim(),
      servicios_moto: [...document.querySelectorAll('.f-serv:checked')].map(c => c.value),
      servicios_otros: document.getElementById('f-otros').value.trim(),
      city: await municipioDelPin(),
      description: document.getElementById('f-desc').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      website: document.getElementById('f-web').value.trim(),
      address: document.getElementById('f-address').value.trim(),
      lat: currentLat, lng: currentLng, photos,
      horario: horarioParaGuardar(),
      cartas: cartasParaGuardar(),
      ...(selectedType === 'hotel' ? { alojamiento: leerAlojamiento() } : {}),
      // La app 1.26.930 y anteriores solo leen apertura/cierre: se les da la primera franja y la última.
      ...(() => { const t = turnosDeLaSemana(); return t.length ? { opening_time: t[0][0], closing_time: t[t.length - 1][1] } : {} })()
    })
    let pendiente = !!rf.pendiente
    for (const h of habsAGuardar) {
      const rh = await api('room_save', { id: h.id, tipo: h.tipo, bano: h.bano, personas: h.personas, cuantas: h.cuantas,
        precio_desde: h.precio_desde, fotos: h.fotos, orden: habitaciones.indexOf(h) })
      h.id = rh.id; h._orig = habFoto(h)
      if (rh.pendiente) { h.pendiente = true; pendiente = true }
    }
    if (habsAGuardar.length) pintarHabs()
    // MC-RF-CAMBIOS-1OCT-2026: un negocio activo no publica al momento; se le dice claro.
    alertSuccess.textContent = pendiente
      ? '✅ Guardado. Lo revisamos antes de publicarlo: en la app sigue saliendo lo de antes hasta entonces. Te avisamos por correo.'
      : '✅ Cambios guardados correctamente.'
    alertSuccess.classList.add('show'); window.scrollTo(0,0)
    guardado = fotoFormulario()
  } catch (err) {
    // MC-RF-GUARDAR-1OCT-2026 (92.ª, Carlos): el error salía ARRIBA y él guardaba desde ABAJO: «no dice nada»,
    // salió y lo perdió todo. Ahora se ve sí o sí: arriba (con la página subiendo) y en una ventana.
    alertError.textContent = 'No se ha guardado: ' + err.message; alertError.classList.add('show'); window.scrollTo(0, 0)
    alert('No se ha guardado.\n\n' + err.message + '\n\nTus datos siguen en la pantalla: corrígelo y vuelve a pulsar «Guardar cambios».')
  }

  delete btn.dataset.guardando
  btn.disabled = false; btn.innerHTML = 'Guardar cambios'
  refrescarBoton()
}
