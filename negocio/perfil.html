<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#FF7A1A;--orange-dark:#E06510;--brown:#6B4423;--cream:#F5EFE8;--card:#EBE0D2;--black:#111111;--gray:#555555;--gray-light:#888888;--white:#FFFFFF;--red:#E53E3E;--green:#38A169}
body{font-family:'Manrope',sans-serif;background:var(--cream);min-height:100vh}
header{background:var(--orange);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:10px}
header img{width:32px;height:32px;border-radius:9px}
header .brand{font-size:15px;font-weight:800;color:#fff}
header .sep{color:rgba(255,255,255,.4);margin:0 4px}
header .biz-name{font-size:13px;color:rgba(255,255,255,.85);font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{background:rgba(255,255,255,.15);color:#fff;border:none;padding:7px 14px;border-radius:50px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-logout:hover{background:rgba(255,255,255,.25)}
nav{background:var(--white);border-bottom:1px solid var(--card);padding:0 24px;display:flex}
.nav-tab{padding:14px 18px;font-size:13px;font-weight:600;color:var(--gray);text-decoration:none;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.nav-tab:hover{color:var(--black)}
.nav-tab.active{color:var(--orange);border-bottom-color:var(--orange)}
main{max-width:800px;margin:0 auto;padding:28px 20px 80px}
.section-block{background:var(--white);border-radius:16px;padding:22px;margin-bottom:16px}
.section-label{font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:5px;letter-spacing:.3px}
.field label span{color:var(--gray-light);font-weight:400}
.field input,.field textarea,.field select{width:100%;padding:10px 14px;font-size:14px;font-family:inherit;background:var(--cream);border:1.5px solid var(--card);border-radius:10px;color:var(--black);transition:border-color .2s;outline:none;resize:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--orange);background:var(--white)}
.field input::placeholder,.field textarea::placeholder{color:var(--gray-light)}
.field-hint{font-size:11px;color:var(--gray-light);margin-top:4px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acc-group{border:1.5px solid var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden}
.acc-header{padding:13px 16px;font-size:13px;font-weight:600;color:var(--black);cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--white);user-select:none;transition:background .15s}
.acc-header:hover{background:var(--cream)}
.acc-header.open{background:rgba(255,122,26,.14);color:#B85000}
.acc-header .arrow{font-size:11px;transition:transform .2s;color:var(--gray-light)}
.acc-header.open .arrow{transform:rotate(180deg)}
.acc-body{display:none;padding:12px 16px;background:var(--cream);border-top:1px solid var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--card);background:var(--white);color:var(--gray);cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{border-color:var(--orange);color:var(--orange)}
.chip.sel{background:rgba(255,122,26,.14);border-color:var(--orange);color:#B85000}
.escape-box{display:flex;align-items:center;gap:10px;background:var(--cream);border:1.5px dashed var(--card);border-radius:10px;padding:12px 14px;margin-top:8px}
.escape-box span{font-size:12px;color:var(--gray);flex:1;line-height:1.5}
.escape-box a{color:var(--orange);font-weight:600;text-decoration:none;white-space:nowrap}
#map{width:100%;height:min(62vh,560px);min-height:340px;border-radius:12px;margin-bottom:6px;cursor:crosshair}
.map-botones{display:flex;gap:8px;margin:0 0 10px}
.map-hint{font-size:11px;color:var(--gray-light);display:flex;align-items:center;gap:4px;margin-bottom:14px}
.photos-guide{background:rgba(255,122,26,.14);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;color:#6B4423;line-height:1.6}

.guide-row{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}

.photo-slot.empty{background:var(--cream);border:2px dashed var(--card)}

.app-card{border-radius:14px;overflow:hidden;border:1px solid var(--card);max-width:280px}
.app-card-img{height:100px;background:linear-gradient(135deg,#EDE7DF,#DCD3C8);position:relative;display:flex;align-items:flex-end;padding:10px}
.app-card-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.55))}
.app-card-txt{position:relative;z-index:1}
.app-card-name{font-size:13px;font-weight:700;color:#fff}
.app-card-cat{font-size:10px;color:rgba(255,255,255,.75);margin-top:1px}

.rf-badge-mini{display:inline-flex;align-items:center;gap:4px;background:rgba(255,122,26,.14);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;color:var(--orange);margin-bottom:7px}
.app-card-desc{font-size:11px;color:var(--gray);line-height:1.5}
.sticky-footer{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--card);padding:14px 20px;display:flex;gap:10px;justify-content:flex-end}
.btn-primary{background:var(--orange);color:#fff;border:none;padding:11px 28px;border-radius:50px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:6px}
.btn-primary:hover{background:var(--orange-dark)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-primary.sin-cambios{background:var(--card);color:var(--gray-light);opacity:1}
.btn-outline{background:transparent;color:var(--brown);border:1.5px solid var(--card);padding:11px 22px;border-radius:50px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-outline:hover{border-color:var(--brown);background:var(--card)}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:16px;display:none}
.alert.error{background:rgba(229,62,62,.14);border:1px solid rgba(229,62,62,.35);color:var(--red)}
.alert.success{background:rgba(61,187,78,.14);border:1px solid rgba(61,187,78,.35);color:var(--green)}
.alert.show{display:block}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:60px 20px;color:var(--gray-light)}
/* MC-RF-ROBLE-30SEP-2026 (89.ª): horario por días y cartas */
.hdia{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--card)}
.hdia-nombre{width:92px;font-size:14px;font-weight:700;color:var(--black)}
.hdia .rf-chip{padding:6px 12px;font-size:12px}
.hfranjas{display:flex;flex-wrap:wrap;gap:8px 14px;width:100%;padding-left:104px}
.hfranja{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray)}
.hfranja input{width:112px;padding:6px 8px;font-size:13px}
.hmismo{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px;cursor:pointer}
@media (max-width:520px){.hfranjas{padding-left:0}}
.carta-row{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--card)}
.carta-row .field{margin:0}
.carta-fich{font-size:12px;color:var(--gray);grid-column:1/-1}
.carta-fich a{color:var(--orange);font-weight:700}
.btn-mini{background:none;border:1.5px solid var(--card);border-radius:50px;padding:7px 12px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--brown)}
.ayuda{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gray-light);background:none;color:var(--gray-light);font-size:11px;font-weight:800;cursor:pointer;margin-left:6px;vertical-align:middle;font-family:inherit}

<script>
const SUPABASE_URL = 'https://yxmirhpwmdmaxynlshdx.supabase.co'
// BIZPORTAL-JWT-1: la clave antigua se va. Se usa la publicable de mas abajo.
const MAPBOX_TOKEN = 'pk.eyJ1IjoibW90b2NsdWJlcyIsImEiOiJjbXA2cmJxaTUwM3djMnJzZXlvMzBycGg0In0.dw_0jtLStDE_MyCAm6zOig'
// SEG7-FOTOS-25AGO: el cliente de Storage va con la clave PUBLICABLE, no con la
// antigua. Storage es API REST, y las claves antiguas estan DESACTIVADAS
// ("Legacy API keys are disabled"): con la vieja, subir una foto no podia funcionar
// -- y el bucket business-photos tenia 0 objetos, que es justo lo que se esperaria.
// OJO: el resto de la pagina (helper api()) sigue con SUPABASE_PUBLISHABLE_KEY A PROPOSITO.
// Las Edge Functions SI aceptan la vieja y van con verify_jwt=false; se cambia una
// cosa cada vez para que la medida signifique algo.
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_qfrmrp5BiNcg1U0gFtA78w_oRAMGzDi'
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)

// MC-BIZPORTAL-25AGO-2026: puerta unica. El business_id ya no vive en el navegador.
const session = JSON.parse(localStorage.getItem('business_session') || 'null')
if (!session || !session.token) { localStorage.removeItem('business_session'); window.location.href = 'login.html' }

async function api(action, payload = {}) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/business-portal`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_PUBLISHABLE_KEY,
      'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
      'x-business-token': session.token
    },
    body: JSON.stringify({ action, payload })
  })
  const data = await res.json().catch(() => ({}))
  if (res.status === 401) { localStorage.removeItem('business_session'); window.location.href = 'login.html'; throw new Error('sesion caducada') }
  if (!res.ok || data.error) throw new Error(data.error || 'Error de conexion')
  return data
}

async function handleLogout() {
  try { await api('logout') } catch (e) {}
  localStorage.removeItem('business_session')
  window.location.href = 'login.html'
}

let currentLat = 40.4168, currentLng = -3.7038
let photos = [], selectedType = '', map, marker, biz

// ---- MC-RF-ROBLE-30SEP-2026 (89.ª, RF-HORARIO-DIAS-1 · diseño de Mario) ----
// Cada día «Abro / Cerrado» con mediodía y noche; «Mismo horario todos los días que abro»;
// festivos como un domingo, cerrado u otro horario. Sustituye a apertura/cierre (una sola franja).
let horario = null
function iniciarHorario(b) {
  if (b.horario && b.horario.dias) horario = JSON.parse(JSON.stringify(b.horario))
  else {
    // Primera vez: lo que tuviera en apertura/cierre, todos los días, como punto de partida.
    const t = b.opening_time && b.closing_time ? [[b.opening_time.slice(0, 5), b.closing_time.slice(0, 5)]] : []
    horario = { mismo: true, dias: {}, festivos: { modo: 'domingo' } }
    MC_DIAS.forEach(d => { horario.dias[d.k] = { abre: t.length > 0, turnos: t.map(x => [...x]) } })
  }
  horario.festivos = horario.festivos || { modo: 'domingo' }
  document.getElementById('h-mismo').checked = !!horario.mismo
  document.getElementById('h-mismo').addEventListener('change', (e) => {
    horario.mismo = e.target.checked
    if (horario.mismo) { const base = turnosComunes(); MC_DIAS.forEach(d => { if (horario.dias[d.k].abre) horario.dias[d.k].turnos = base.map(x => [...x]) }) }
    pintarHorario()
  })
  pintarHorario()
}
function turnosComunes() {
  const d = MC_DIAS.map(x => horario.dias[x.k]).find(x => x && x.abre && (x.turnos || []).length)
  return d ? d.turnos : []
}
// Dos franjas fijas en pantalla: [0] mediodía, [1] noche. Vacías = ese turno no abre.
function franjasHtml(turnos, pref) {
  const t = turnos || []
  const f = (i, nombre) => `<div class="hfranja">${nombre} <input type="time" data-f="${pref}" data-i="${i}" data-j="0" value="${(t[i] || [])[0] || ''}"> a <input type="time" data-f="${pref}" data-i="${i}" data-j="1" value="${(t[i] || [])[1] || ''}"></div>`
  return f(0, 'Mediodía') + f(1, 'Noche')
}
function leerFranjas(pref) {
  const v = (i, j) => (document.querySelector(`input[data-f="${pref}"][data-i="${i}"][data-j="${j}"]`) || {}).value || ''
  return [0, 1].map(i => [v(i, 0), v(i, 1)]).filter(x => x[0] && x[1])
}
function pintarHorario() {
  const comun = document.getElementById('h-comun')
  comun.innerHTML = horario.mismo ? `<div class="hdia"><div class="hdia-nombre">Horario</div><div class="hfranjas" style="padding-left:0">${franjasHtml(turnosComunes(), 'comun')}</div></div>` : ''
  document.getElementById('h-dias').innerHTML = MC_DIAS.map(d => {
    const x = horario.dias[d.k] || { abre: false }
    return `<div class="hdia"><div class="hdia-nombre">${d.l}</div>
      <div class="rf-chips"><button type="button" class="rf-chip${x.abre ? ' sel' : ''}" onclick="abreDia('${d.k}',true)">Abro</button><button type="button" class="rf-chip${x.abre ? '' : ' sel'}" onclick="abreDia('${d.k}',false)">Cerrado</button></div>
      ${x.abre && !horario.mismo ? `<div class="hfranjas">${franjasHtml(x.turnos, d.k)}</div>` : ''}</div>`
  }).join('')
  const modos = [['domingo', 'Como un domingo'], ['cerrado', 'Cerrado'], ['otro', 'Otro horario']]
  document.getElementById('h-fest').innerHTML = modos.map(([k, l]) =>
    `<button type="button" class="rf-chip${horario.festivos.modo === k ? ' sel' : ''}" onclick="modoFestivo('${k}')">${l}</button>`).join('')
  document.getElementById('h-fest-franjas').innerHTML = horario.festivos.modo === 'otro' ? franjasHtml(horario.festivos.turnos, 'fest') : ''
  document.querySelectorAll('input[data-f]').forEach(i => i.addEventListener('input', leerHorario))
  pintarPrevia()
}
function leerHorario() {
  if (horario.mismo) {
    const t = leerFranjas('comun')
    MC_DIAS.forEach(d => { if (horario.dias[d.k].abre) horario.dias[d.k].turnos = t.map(x => [...x]) })
  } else {
    MC_DIAS.forEach(d => { if (horario.dias[d.k].abre && document.querySelector(`input[data-f="${d.k}"]`)) horario.dias[d.k].turnos = leerFranjas(d.k) })
  }
  if (horario.festivos.modo === 'otro') horario.festivos.turnos = leerFranjas('fest')
  pintarPrevia()
}
window.abreDia = function (k, abre) {
  leerHorario()
  horario.dias[k] = { abre, turnos: abre ? (horario.mismo ? turnosComunes() : (horario.dias[k].turnos || [])).map(x => [...x]) : [] }
  pintarHorario()
}
window.modoFestivo = function (m) { leerHorario(); horario.festivos = { modo: m, turnos: m === 'otro' ? (horario.festivos.turnos || []) : undefined }; pintarHorario() }
// Lo que se guarda: un día «Abro» sin ninguna franja no dice nada al motero; se avisa antes.
function horarioParaGuardar() {
  leerHorario()
  const sinHora = MC_DIAS.filter(d => horario.dias[d.k].abre && !(horario.dias[d.k].turnos || []).length).map(d => d.l)
  if (sinHora.length) throw new Error('pon la hora de ' + sinHora.join(', ') + ' (o márcalo como Cerrado)')
  return horario
}

// ---- MC-RF-ROBLE-30SEP-2026 (89.ª, RF-CARTA-1 · diseño de Mario): nombre libre, foto o PDF, precio opcional, varias ----
let cartas = [], cartaSubiendo = null
function pintarCartas() {
  const cont = document.getElementById('cartas')
  if (!cartas.length) cartas.push({ nombre: '', url: '', precio: null })
  cont.innerHTML = cartas.map((c, i) => `
    <div class="carta-row">
      <div class="field"><label>NOMBRE</label><input type="text" maxlength="60" value="${esc(c.nombre || '')}" placeholder="Menú motero, Carta, Menú del día…" oninput="cartas[${i}].nombre=this.value;pintarPrevia()"></div>
      <div class="field"><label>PRECIO <span>(opcional)</span></label><input type="number" min="0" step="0.5" value="${c.precio ?? ''}" placeholder="18" oninput="cartas[${i}].precio=this.value===''?null:Number(this.value);pintarPrevia()"></div>
      <button type="button" class="btn-mini" onclick="quitarCarta(${i})">Quitar</button>
      <div class="carta-fich">${c.url
        ? `${c.url.toLowerCase().endsWith('.pdf') ? '📄 PDF' : '🖼️ Foto'} subido · <a href="${esc(c.url)}" target="_blank" rel="noopener">ver</a> · <a href="#" onclick="subirCarta(${i});return false">cambiar</a>`
        : `<button type="button" class="btn-mini" onclick="subirCarta(${i})">+ Foto o PDF</button>`}</div>
    </div>`).join('')
  pintarPrevia()
}
window.nuevaCarta = function () { if (cartas.length >= 10) return alert('Como mucho 10 cartas o menús.'); cartas.push({ nombre: '', url: '', precio: null }); pintarCartas() }
window.quitarCarta = function (i) { cartas.splice(i, 1); pintarCartas() }
window.subirCarta = function (i) { cartaSubiendo = i; document.getElementById('carta-input').click() }
document.getElementById('carta-input').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = ''
  if (!file || cartaSubiendo === null) return
  const i = cartaSubiendo; cartaSubiendo = null
  try {
    const esPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')
    const r = esPdf ? { blob: file, ext: 'pdf' } : await reducirFoto(file)
    if (r.blob.size > 10 * 1024 * 1024) throw new Error('pesa más de 10 MB')
    const slot = await api('photo_slot', { ext: r.ext })
    const { error } = await sbClient.storage.from('business-photos')
      .uploadToSignedUrl(slot.path, slot.token, r.blob, { contentType: esPdf ? 'application/pdf' : (r.blob.type || 'image/jpeg') })
    if (error) throw new Error(error.message)

})

  if (previewImg) {

// SEG7-FOTOS-REDUCIR-25AGO: antes se RECHAZABA toda foto de mas de 2 MB. Ese tope
// era de esta pagina, no del bucket (business-photos va sin file_size_limit), y
// cualquier foto de movil lo pasa: el portal era inusable con un telefono. Nadie lo
// vio porque nadie lo uso (0 objetos en el bucket).
// Ahora no se rechaza: se REDUCE aqui antes de subir. Un directorio no necesita
// 4000 px, y asi el rider tampoco se traga los megas al pintar el negocio.
// Medido con la primera foto real (25-ago): a 1600/0.82 salio de 1.377 KB, demasiado
// para que lo descargue un rider con datos moviles. Un directorio no necesita mas.
const FOTO_LADO_MAX = 1280
const FOTO_CALIDAD = 0.75

async function reducirFoto(file) {
  // Si no es imagen o el navegador no sabe decodificarla, se sube tal cual.
  if (!file.type.startsWith('image/')) return { blob: file, ext: (file.name.split('.').pop() || 'jpg'), reducida: false, motivo: 'no es imagen' }
  try {
    const bitmap = await createImageBitmap(file)
    const escala = Math.min(1, FOTO_LADO_MAX / Math.max(bitmap.width, bitmap.height))
    const w = Math.round(bitmap.width * escala)
    const h = Math.round(bitmap.height * escala)
    const lienzo = document.createElement('canvas')
    lienzo.width = w; lienzo.height = h
    lienzo.getContext('2d').drawImage(bitmap, 0, 0, w, h)
    const blob = await new Promise(r => lienzo.toBlob(r, 'image/jpeg', FOTO_CALIDAD))
    bitmap.close && bitmap.close()
    if (!blob) throw new Error('toBlob vacio')
    // Si reducir no ha servido de nada (ya era pequena y comprimida), gana la original.
    if (blob.size >= file.size) return { blob: file, ext: (file.name.split('.').pop() || 'jpg'), w, h, reducida: false, motivo: 'reducir no bajaba el peso' }
    return { blob, ext: 'jpg', w, h, reducida: true }
  } catch (err) {
    console.warn('[fotos] no se pudo reducir, se sube la original:', err)
    return { blob: file, ext: (file.name.split('.').pop() || 'jpg'), reducida: false, motivo: String(err && err.message || err) }
  }
}

document.getElementById('file-input').addEventListener('change', async e => {
  const files = Array.from(e.target.files)
  for (const file of files) {
    try {
      const r = await reducirFoto(file)
      const { blob, ext } = r
      // Red de seguridad: si aun asi es enorme, no se sube a ciegas.
      if (blob.size > 8 * 1024 * 1024) throw new Error('la foto sigue pesando ' + Math.round(blob.size / 1048576) + ' MB despues de reducirla')
      // El servidor decide la ruta y firma la subida: la foto nace con dueno.
      const slot = await api('photo_slot', { ext })
      const { error } = await sbClient.storage.from('business-photos')
        .uploadToSignedUrl(slot.path, slot.token, blob, { contentType: blob.type || 'image/jpeg' })
      if (error) throw new Error(error.message)
      if (photos.length < 5) photos.push(slot.public_url)
      renderPhotos()
      // El veredicto se PINTA. En un movil no hay consola que mirar.
      const hint = document.getElementById('foto-hint')
      if (hint) {
        hint.innerHTML = r.reducida
          ? 'Subida: ' + Math.round(file.size/1024) + ' KB → <b>' + Math.round(blob.size/1024) + ' KB</b>'
          : 'Subida sin reducir (' + (r.motivo || 'sin motivo') + ')'
      }
    } catch (err) {
      alert('No se pudo subir ' + file.name + ': ' + err.message)
    }
  }
  e.target.value = ''
})

  try {
    if (!selectedType) throw new Error('elige qué tipo de negocio es')
    await api('profile_update', {
      name, type: selectedType,

      ...(() => { const t = turnosDeLaSemana(); return t.length ? { opening_time: t[0][0], closing_time: t[t.length - 1][1] } : {} })()
    })

    guardado = loQueSeGuarda
  } catch (err) {
    alertError.textContent = 'Error al guardar: ' + err.message; alertError.classList.add('show')
  }

  delete btn.dataset.guardando
  btn.disabled = false; btn.innerHTML = 'Guardar cambios'
  refrescarBoton()
}



window.handleSave = handleSave
window.handleLogout = handleLogout

loadPerfil()
</script>
<script src="/assets/visita.js" defer></script>
