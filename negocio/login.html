<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTOCLUBes · Acceso negocio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#FF7A1A;--orange-dark:#E06510;--cream:#F5EFE8;--card:#EBE0D2;--black:#111111;--gray:#555555;--gray-light:#888888;--white:#FFFFFF;--red:#E53E3E}
body{font-family:'Manrope',sans-serif;background:var(--cream);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--orange);padding:14px 24px;display:flex;align-items:center;gap:10px}
header img{width:32px;height:32px;border-radius:9px}
header span{font-size:15px;font-weight:800;color:#fff}
header .sep{color:rgba(255,255,255,.4);margin:0 4px}
header .sub{font-size:13px;color:rgba(255,255,255,.8);font-weight:500}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:var(--white);border-radius:20px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.card-title{font-size:20px;font-weight:800;color:var(--black);margin-bottom:6px}
.card-sub{font-size:14px;color:var(--gray);margin-bottom:28px;line-height:1.5}
.card-sub a{color:var(--orange);text-decoration:none;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px;letter-spacing:.3px}
.field input{width:100%;padding:10px 14px;font-size:14px;font-family:inherit;background:var(--cream);border:1.5px solid var(--card);border-radius:10px;color:var(--black);transition:border-color .2s;outline:none}
.field input:focus{border-color:var(--orange);background:var(--white)}
.field input::placeholder{color:var(--gray-light)}
.btn{width:100%;padding:12px;background:var(--orange);color:#fff;border:none;border-radius:50px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s,transform .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--orange-dark);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:16px;display:none;line-height:1.5}
.alert.error{background:#FFF5F5;border:1px solid #FED7D7;color:var(--red)}
.alert.show{display:block}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <img src="https://motoclubes.es/email-logo-helmet.png" alt="MOTOCLUBes">
  <span>MOTOCLUBes</span><span class="sep">·</span><span class="sub">Panel de negocio</span>
</header>
<main>
  <div class="card">
    <div class="card-title">Iniciar sesión</div>
    <div class="card-sub">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></div>
    <div class="alert error" id="alert-error"></div>
    <div class="field"><label>EMAIL</label><input type="email" id="email" placeholder="correo@tunegocio.es" autocomplete="email"></div>
    <div class="field"><label>CONTRASEÑA</label><input type="password" id="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn" id="btn-login" onclick="handleLogin()">Entrar al panel</button>
  </div>
</main>
<script>
const SUPABASE_URL = 'https://yxmirhpwmdmaxynlshdx.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWlyaHB3bWRtYXh5bmxzaGR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxODc2MDcsImV4cCI6MjA5Mzc2MzYwN30.tCJKmAeG9A3ua1WJ5s166OvnIMalfS9SLOA23McirGc'

async function handleLogin() {
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const btn = document.getElementById('btn-login')
  const alertError = document.getElementById('alert-error')

  alertError.classList.remove('show')

  if (!email || !password) {
    alertError.textContent = 'Por favor rellena todos los campos.'
    alertError.classList.add('show')
    return
  }

  btn.disabled = true
  btn.innerHTML = '<div class="spinner"></div> Entrando...'

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/business-login`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({ email, password })
    })

    const data = await res.json()

    if (!res.ok || data.error) {
      alertError.textContent = data.error || 'Email o contraseña incorrectos.'
      alertError.classList.add('show')
      btn.disabled = false
      btn.innerHTML = 'Entrar al panel'
      return
    }

    localStorage.setItem('business_session', JSON.stringify({
      user_id: data.user_id,
      business_id: data.business_id,
      email: data.email
    }))

    window.location.href = 'index.html'

  } catch(e) {
    alertError.textContent = 'Error de conexión: ' + e.message
    alertError.classList.add('show')
    btn.disabled = false
    btn.innerHTML = 'Entrar al panel'
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleLogin()
})
</script>
</body>
</html>
