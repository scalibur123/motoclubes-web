<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTOCLUBes · Portal negocios</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF7A1A;--orange-dark:#E06510;--brown:#6B4423;
  --cream:#F5EFE8;--card:#EBE0D2;--black:#111111;
  --gray:#555555;--gray-light:#888888;--white:#FFFFFF;
  --red:#E53E3E;--green:#38A169;
}
body{font-family:'Manrope',sans-serif;background:var(--cream);
  min-height:100vh;display:flex;flex-direction:column}
header{background:var(--orange);padding:14px 24px;
  display:flex;align-items:center;gap:10px}
header img{width:32px;height:32px;border-radius:9px}
header span{font-size:15px;font-weight:800;color:#fff;letter-spacing:-0.3px}
header .sep{color:rgba(255,255,255,.4);margin:0 4px}
header .sub{font-size:13px;color:rgba(255,255,255,.8);font-weight:500}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:var(--white);border-radius:20px;padding:36px 32px;
  width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.card-title{font-size:20px;font-weight:800;color:var(--black);margin-bottom:6px}
.card-sub{font-size:14px;color:var(--gray);margin-bottom:28px;line-height:1.5}
.card-sub a{color:var(--orange);text-decoration:none;font-weight:600}
.card-sub a:hover{text-decoration:underline}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;
  color:var(--gray);margin-bottom:6px;letter-spacing:.3px}
.field input{width:100%;padding:10px 14px;font-size:14px;font-family:inherit;
  background:var(--cream);border:1.5px solid var(--card);border-radius:10px;
  color:var(--black);transition:border-color .2s,background .2s;outline:none}
.field input:focus{border-color:var(--orange);background:var(--white)}
.field input::placeholder{color:var(--gray-light)}
.forgot{display:block;text-align:right;font-size:12px;
  color:var(--gray);text-decoration:none;margin-top:-8px;margin-bottom:20px}
.forgot:hover{color:var(--orange)}
.btn{width:100%;padding:12px;background:var(--orange);color:#fff;
  border:none;border-radius:50px;font-size:15px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:background .2s,transform .15s;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--orange-dark);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.divider{border:none;border-top:1px solid var(--card);margin:24px 0}
.info-box{background:var(--cream);border-radius:10px;padding:12px 14px;
  font-size:12px;color:var(--gray);line-height:1.6;
  display:flex;align-items:flex-start;gap:8px}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;
  font-weight:500;margin-bottom:16px;display:none}
.alert.error{background:#FFF5F5;border:1px solid #FED7D7;color:var(--red)}
.alert.success{background:#F0FFF4;border:1px solid #C6F6D5;color:var(--green)}
.alert.show{display:block}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <img src="https://motoclubes.es/email-logo-helmet.png" alt="MOTOCLUBes">
  <span>MOTOCLUBes</span>
  <span class="sep">·</span>
  <span class="sub">Portal negocios</span>
</header>

<main>
  <div class="card">
    <div class="card-title">Accede a tu panel</div>
    <div class="card-sub">
      ¿Primera vez? <a href="registro.html">Solicita darte de alta</a>
    </div>

    <div class="alert error" id="alert-error"></div>
    <div class="alert success" id="alert-success"></div>

    <div class="field">
      <label>EMAIL</label>
      <input type="email" id="email" placeholder="correo@tunegocio.es" autocomplete="email">
    </div>
    <div class="field">
      <label>CONTRASEÑA</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <a href="reset.html" class="forgot">¿Olvidaste tu contraseña?</a>

    <button class="btn" id="btn-login" onclick="handleLogin()">Entrar</button>

    <hr class="divider">

    <div class="info-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Al registrarte recibirás un email de confirmación. Debes verificarlo antes de poder acceder al panel.
    </div>
  </div>
</main>

<script type="module">
import { supabase } from './js/supabase.js'

window.handleLogin = async function() {
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const btn = document.getElementById('btn-login')
  const alertError = document.getElementById('alert-error')
  const alertSuccess = document.getElementById('alert-success')

  alertError.classList.remove('show')
  alertSuccess.classList.remove('show')

  if (!email || !password) {
    alertError.textContent = 'Por favor introduce tu email y contraseña.'
    alertError.classList.add('show')
    return
  }

  btn.disabled = true
  btn.innerHTML = '<div class="spinner"></div> Entrando...'

  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password })

    if (error) {
      let msg = 'Error al iniciar sesión. Revisa tus datos.'
      if (error.message.includes('Email not confirmed')) {
        msg = 'Debes confirmar tu email antes de acceder. Revisa tu bandeja de entrada.'
      } else if (error.message.includes('Invalid login credentials')) {
        msg = 'Email o contraseña incorrectos.'
      }
      alertError.textContent = msg
      alertError.classList.add('show')
      btn.disabled = false
      btn.innerHTML = 'Entrar'
      return
    }

    const { data: bizUser } = await supabase
      .from('business_users')
      .select('id, business_id')
      .eq('id', data.user.id)
      .single()

    if (!bizUser) {
      await supabase.auth.signOut()
      alertError.textContent = 'Esta cuenta no tiene acceso al portal de negocios.'
      alertError.classList.add('show')
      btn.disabled = false
      btn.innerHTML = 'Entrar'
      return
    }

    window.location.href = 'index.html'

  } catch (e) {
    alertError.textContent = 'Error de conexión. Inténtalo de nuevo.'
    alertError.classList.add('show')
    btn.disabled = false
    btn.innerHTML = 'Entrar'
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') window.handleLogin()
})

;(async () => {
  const { data: { session } } = await supabase.auth.getSession()
  if (session) window.location.href = 'index.html'
})()
</script>

</body>
</html>
