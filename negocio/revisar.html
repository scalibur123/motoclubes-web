<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTOCLUBes · Revisar un cambio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#FF7A1A;--orange-dark:#E06510;--cream:#F5EFE8;--card:#EBE0D2;--black:#111111;--gray:#555555;--gray-light:#888888;--white:#FFFFFF;--red:#E53E3E}
body{font-family:'Manrope',sans-serif;background:var(--cream);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--orange);padding:14px 24px;display:flex;align-items:center;gap:10px}
header img{width:32px;height:32px;border-radius:9px}
header span{font-size:15px;font-weight:800;color:#fff}
header .sep{color:rgba(255,255,255,.4);margin:0 4px}
header .sub{font-size:13px;color:rgba(255,255,255,.8);font-weight:500}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:var(--white);border-radius:20px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.card-title{font-size:20px;font-weight:800;color:var(--black);margin-bottom:6px}
.card-sub{font-size:14px;color:var(--gray);margin-bottom:28px;line-height:1.5}
.card-sub a{color:var(--orange);text-decoration:none;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px;letter-spacing:.3px}
.field input{width:100%;padding:10px 14px;font-size:14px;font-family:inherit;background:var(--cream);border:1.5px solid var(--card);border-radius:10px;color:var(--black);transition:border-color .2s;outline:none}
.field input:focus{border-color:var(--orange);background:var(--white)}
.field input::placeholder{color:var(--gray-light)}
.password-wrap{position:relative}
.password-wrap input{padding-right:42px}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray-light);font-size:18px;padding:0;line-height:1}
.btn{width:100%;padding:12px;background:var(--orange);color:#fff;border:none;border-radius:50px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s,transform .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--orange-dark);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:16px;display:none;line-height:1.5}
.alert.error{background:rgba(229,62,62,.14);border:1px solid rgba(229,62,62,.35);color:var(--red)}
.alert.show{display:block}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{max-width:560px}
.rev-fila{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--card);font-size:14px}
.rev-fila b{min-width:110px;color:var(--gray-light);font-weight:600}
.rev-fila span{color:var(--black);flex:1;white-space:pre-line}
.rev-fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.rev-fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.rev-serv{display:flex;flex-wrap:wrap;gap:6px}
.rev-serv i{font-style:normal;background:var(--cream);border:1px solid var(--card);border-radius:50px;padding:4px 10px;font-size:12px}
.rev-tabla{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.rev-tabla td{padding:9px 8px 9px 0;border-bottom:1px solid var(--card);vertical-align:top}
.rev-tabla .k{color:var(--gray-light);font-weight:600;width:130px}
.rev-tabla .antes{color:var(--gray-light);text-decoration:line-through}
.rev-tabla .ahora{color:var(--black);font-weight:600}
.rev-mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rev-mini img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.rev-botones{display:flex;gap:10px;margin-top:22px}
.btn-rechazar{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn-rechazar:hover{background:rgba(229,62,62,.1)}
.rev-agente{background:#F3F3F3;border-left:3px solid #888;padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.5;margin:-12px 0 16px}
.rev-agente.raro{background:rgba(255,122,26,.10);border-left-color:var(--orange)}
.rev-agente b{color:var(--black)}
textarea{width:100%;padding:10px 14px;font-size:14px;font-family:inherit;background:var(--cream);border:1.5px solid var(--card);border-radius:10px;color:var(--black);outline:none;resize:vertical;margin-top:12px}
</style>
<link rel="stylesheet" href="negocio.css">
</head>
<body>
<header>
  <a href="/" class="marca-portal" title="Ir a motoclubes.es"><img src="https://motoclubes.es/email-logo-helmet.png" alt="MOTOCLUBes">
  <span>MOTOCLUBes</span></a><span class="sep">·</span><span class="sub">Revisar un cambio</span>
</header>
<main>
  <!-- MC-RF-CAMBIOS-1OCT-2026 (92.ª, RF-REVISION-CAMBIOS-1): aquí llega el botón «Revisar» del correo
       «Cambio para revisar» que recibe soporte@. Abrir no decide nada: hay que pulsar Aprobar o Rechazar.
       MC-AGENTE-REVISOR-1OCT-2026 (93.ª): arriba, lo que vio el agente (si lo retuvo o no pudo mirarlo), y una
       «Lección para el agente» opcional que se guarda al decidir (agente_lecciones). -->
  <div class="card">
    <div class="alert error" id="alert-error"></div>
    <div id="cargando" style="color:var(--gray);font-size:14px">Cargando el cambio…</div>
    <div id="cambio" style="display:none"></div>
    <div id="ok-view" style="display:none;text-align:center">
      <div style="font-size:44px;margin-bottom:12px" id="ok-icono"></div>
      <div class="card-title" id="ok-titulo"></div>
      <div class="card-sub" style="margin-top:8px" id="ok-sub"></div>
    </div>
  </div>
</main>
<script>
const SUPABASE_URL = 'https://yxmirhpwmdmaxynlshdx.supabase.co'
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_qfrmrp5BiNcg1U0gFtA78w_oRAMGzDi'
const token = new URLSearchParams(location.search).get('t') || ''
const esc = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
function error(txt) { const a = document.getElementById('alert-error'); a.textContent = txt; a.classList.add('show') }
async function llamar(action, extra = {}) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/business-review`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_PUBLISHABLE_KEY, 'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}` },
    body: JSON.stringify({ action, token, ...extra })
  })
  const data = await res.json().catch(() => ({}))
  if (!res.ok || data.error) throw new Error(data.error || 'No se ha podido completar.')
  return data
}
const QUE = { ficha: 'su ficha', habitacion: 'una habitación', oferta: 'una oferta nueva' }
const mini = (us) => us && us.length ? `<div class="rev-mini">${us.map(u => `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" alt=""></a>`).join('')}</div>` : ''
async function cargar() {
  document.getElementById('cargando').style.display = 'none'
  if (!token) return error('Este enlace no es válido.')
  let d
  try { d = await llamar('cambio_ver') } catch (e) { return error(e.message) }
  const crear = d.accion === 'crear'
  const que = d.objeto === 'habitacion' && crear ? 'una habitación nueva' : QUE[d.objeto]
  document.getElementById('cambio').innerHTML = `
    <div class="card-title">${esc(d.negocio)}</div>
    <div class="card-sub">${esc(d.municipio || '')}${d.municipio ? ' · ' : ''}ha cambiado ${que} el ${new Date(d.creado_en).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' })}.
      En la app sigue lo de antes hasta que lo apruebes.</div>
    ${d.agente_nota ? `<div class="rev-agente${d.agente_veredicto === 'raro' ? ' raro' : ''}"><b>${d.agente_veredicto === 'raro' ? 'El agente lo ha retenido' : 'El agente no lo ha podido mirar'}:</b> ${esc(d.agente_nota)}</div>` : ''}
    <table class="rev-tabla">
      ${crear ? '' : '<tr><td></td><td style="font-size:12px;color:var(--gray-light)">Antes</td><td style="font-size:12px;color:var(--gray-light)">Ahora</td></tr>'}
      ${d.filas.map(f => `<tr><td class="k">${esc(f.etiqueta || f.clave)}</td>
        ${crear ? '' : `<td class="antes">${esc(f.antes)}${mini(f.fotos_antes)}</td>`}
        <td class="ahora">${esc(f.ahora)}${mini(f.fotos_ahora)}</td></tr>`).join('')}
    </table>
    <textarea id="motivo" rows="2" maxlength="500" placeholder="Si lo rechazas, el motivo (le llega al negocio)"></textarea>
    <textarea id="leccion" rows="2" maxlength="1000" placeholder="Lección para el agente (opcional): qué tenía que haber visto o por qué esto sí es normal. No le llega al negocio."></textarea>
    <div class="rev-botones">
      <button class="btn" id="btn-aprobar">Aprobar y publicar</button>
      <button class="btn btn-rechazar" id="btn-rechazar">Rechazar</button>
    </div>`
  document.getElementById('cambio').style.display = 'block'
  const decidir = async (aprobar) => {
    const motivo = document.getElementById('motivo').value.trim()
    if (!aprobar && !motivo) { error('Escribe el motivo: le llega al negocio.'); return }
    document.querySelectorAll('.rev-botones .btn').forEach(b => b.disabled = true)
    try {
      const r = await llamar('cambio_decidir', { aprobar, motivo, leccion: document.getElementById('leccion').value.trim() })
      document.getElementById('cambio').style.display = 'none'
      document.getElementById('alert-error').classList.remove('show')
      document.getElementById('ok-icono').textContent = aprobar ? '✅' : '✋'
      document.getElementById('ok-titulo').textContent = aprobar ? 'Publicado' : 'Rechazado'
      document.getElementById('ok-sub').textContent = aprobar
        ? `Ya sale en la app y a ${r.negocio} le hemos mandado un correo.`
        : `${r.negocio} recibe un correo con el motivo. En la app sigue lo de antes.`
      document.getElementById('ok-view').style.display = 'block'
    } catch (e) { error(e.message); document.querySelectorAll('.rev-botones .btn').forEach(b => b.disabled = false) }
  }
  document.getElementById('btn-aprobar').addEventListener('click', () => decidir(true))
  document.getElementById('btn-rechazar').addEventListener('click', () => decidir(false))
}
cargar()
</script>
<script src="/assets/visita.js" defer></script>
</body>
</html>
