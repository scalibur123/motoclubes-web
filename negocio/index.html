<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex"><!-- SEO-1: panel de negocios con acceso, no para Google -->
<script src="i18n.js"></script> <!-- RF-PORTAL-INGLES-1: el portal en inglés -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTOCLUBes · Panel de negocio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#FF7A1A;--orange-dark:#E06510;--brown:#6B4423;--cream:#F5EFE8;--card:#EBE0D2;--black:#111111;--gray:#555555;--gray-light:#888888;--white:#FFFFFF}
body{font-family:'Manrope',sans-serif;background:var(--cream);min-height:100vh}
header{background:var(--orange);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:10px}
header img{width:32px;height:32px;border-radius:9px}
header .brand{font-size:15px;font-weight:800;color:#fff}
header .sep{color:rgba(255,255,255,.4);margin:0 4px}
header .biz-name{font-size:13px;color:rgba(255,255,255,.85);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{background:rgba(255,255,255,.15);color:#fff;border:none;padding:7px 14px;border-radius:50px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-logout:hover{background:rgba(255,255,255,.25)}
nav{background:var(--white);border-bottom:1px solid var(--card);padding:0 24px;display:flex}
.nav-tab{padding:14px 18px;font-size:13px;font-weight:600;color:var(--gray);text-decoration:none;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.nav-tab:hover{color:var(--black)}
.nav-tab.active{color:var(--orange);border-bottom-color:var(--orange)}
main{max-width:800px;margin:0 auto;padding:28px 20px}
.rf-banner{border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:24px}
.rf-banner.active{background:rgba(61,187,78,.14);border:1.5px solid rgba(61,187,78,.35)}
.rf-banner.inactive{background:rgba(245,197,24,.12);border:1.5px solid rgba(245,197,24,.35)}
.rf-banner-icon{font-size:24px}
.rf-banner-title{font-size:14px;font-weight:700}
.rf-banner.active .rf-banner-title{color:#276749}
.rf-banner.inactive .rf-banner-title{color:#744210}
.rf-banner-sub{font-size:12px;margin-top:2px}
.rf-banner.active .rf-banner-sub{color:#38A169}
.rf-banner.inactive .rf-banner-sub{color:#975A16}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:14px;padding:18px;text-align:center}
.stat-num{font-size:28px;font-weight:800;color:var(--black)}
.stat-lbl{font-size:11px;color:var(--gray-light);margin-top:4px;font-weight:500}
.section-title{font-size:13px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.ofertas-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.oferta-item{background:var(--white);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.oferta-pct{font-size:20px;font-weight:800;color:var(--orange);min-width:48px}
.oferta-info{flex:1}
.oferta-title{font-size:14px;font-weight:600;color:var(--black)}
.oferta-meta{font-size:12px;color:var(--gray-light);margin-top:2px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.badge.on{background:rgba(61,187,78,.16);color:#3B6D11}
.badge.off{background:var(--cream);color:var(--gray)}
.empty-state{background:var(--white);border-radius:14px;padding:32px;text-align:center;color:var(--gray-light);font-size:14px}
.btn-row{display:flex;gap:10px;margin-bottom:24px}
.btn-primary{background:var(--orange);color:#fff;border:none;padding:11px 22px;border-radius:50px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-primary:hover{background:var(--orange-dark)}
.btn-outline{background:transparent;color:var(--brown);border:1.5px solid var(--card);padding:11px 22px;border-radius:50px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-outline:hover{border-color:var(--brown);background:var(--card)}
.btn-ghost{background:transparent;color:var(--orange);border:1.5px solid var(--orange);padding:9px 18px;border-radius:50px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;width:100%}
.btn-ghost:hover{background:rgba(255,122,26,.08)}
.loading{text-align:center;padding:60px 20px;color:var(--gray-light);font-size:14px}
.spinner{width:24px;height:24px;border:2px solid var(--card);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="negocio.css"><!-- MC-PORTAL-OSCURO-21SEP-2026 -->
<script src="negocio.js"></script><!-- RF-RESPUESTAS-1: mcOpiniones -->
</head>
<body class="tema-claro"><!-- MC-PORTAL-CLARO-21SEP-2026 -->
<header>
  <div class="header-left">
    <a href="/" class="marca-portal" title="Ir a motoclubes.es"><img src="https://motoclubes.es/email-logo-helmet.png" alt="MOTOCLUBes">
    <span class="brand">MOTOCLUBes</span></a>
    <span class="sep">·</span>
    <span class="biz-name" id="biz-name">Cargando...</span>
  </div>
  <button class="btn-logout" onclick="handleLogout()">Cerrar sesión</button>
</header>
<nav>
  <a href="index.html" class="nav-tab active">Panel</a>
  <a href="ofertas.html" class="nav-tab">Ofertas</a>
  <a href="perfil.html" class="nav-tab">Perfil</a>
  <a href="scanner.html" class="nav-tab">Escáner</a>
</nav>
<main>
  <div class="loading"><div class="spinner"></div>Cargando tu panel...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://yxmirhpwmdmaxynlshdx.supabase.co'
// BIZPORTAL-JWT-1 (25-ago-2026): aqui vivia la clave ANTIGUA (eyJ...), que Supabase
// tiene DESACTIVADA. Aguantaba porque business-portal iba con verify_jwt = true y el
// portero aun la verificaba. Hoy esa funcion pasa a verify_jwt = false (la autentica
// x-business-token contra business_sessions, no el JWT), asi que el peaje sobra y
// entra la clave PUBLICABLE, que es la viva. Verificado pagina por pagina.
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_qfrmrp5BiNcg1U0gFtA78w_oRAMGzDi'
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)

// MC-BIZPORTAL-25AGO-2026: puerta unica. El business_id ya no vive en el navegador.
const session = JSON.parse(localStorage.getItem('business_session') || 'null')
if (!session || !session.token) { localStorage.removeItem('business_session'); window.location.href = 'login.html' }

async function api(action, payload = {}) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/business-portal`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_PUBLISHABLE_KEY,
      'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
      'x-business-token': session.token
    },
    body: JSON.stringify({ action, payload })
  })
  const data = await res.json().catch(() => ({}))
  if (res.status === 401) { localStorage.removeItem('business_session'); window.location.href = 'login.html'; throw new Error('sesion caducada') }
  if (!res.ok || data.error) throw new Error(data.error || 'Error de conexion')
  return data
}

async function handleLogout() {
  try { await api('logout') } catch (e) {}
  localStorage.removeItem('business_session')
  window.location.href = 'login.html'
}

async function loadPanel() {
  const d = await api('dashboard')
  const biz = d.business
  const canjes = d.canjes_mes
  const ofertas = d.offers

  document.getElementById('biz-name').textContent = biz?.name || session.email
  // MC-RF-ROBLE-30SEP-2026 (89.ª, RF-FUNDADOR-1): etiqueta de socio fundador en el panel.

  const rfActive = biz?.is_active === true
  // MC-RF-NEGOCIO-21SEP-2026 (RF-PROMESA-PORTAL-1): antes prometía «rellena tu perfil y publica
  // una oferta» para salir en el mapa, y ninguna de las dos cosas activaba nada. Ahora dice lo
  // que falta de verdad y que lo activa MOTOCLUBes tras revisarlo.
  const faltan = []
  if (!biz?.type) faltan.push('el tipo de negocio')
  if (biz?.lat == null || biz?.lng == null) faltan.push('la ubicación en el mapa')
  if (!(biz?.photos || []).length) faltan.push('al menos una foto')

  // MC-RF-ROBLE-30SEP-2026 (89.ª, RF-FUNDADOR-1): la etiqueta va arriba del panel, no en la cabecera (en el móvil no cabía).
  document.querySelector('main').innerHTML = `
    ${biz?.fundador ? '<div style="display:inline-block;margin:0 0 14px;padding:5px 12px;border-radius:50px;background:rgba(245,197,24,.2);color:#8a6400;font-size:13px;font-weight:800">👑 Socio fundador de Rider Friendly · gratis para siempre</div>' : ''}
    <div class="rf-banner ${rfActive ? 'active' : 'inactive'}">
      <div class="rf-banner-icon">${rfActive ? '🪖' : '⏳'}</div>
      <div>
        <div class="rf-banner-title">${rfActive
          ? 'Tu negocio aparece en el mapa de MOTOCLUBes como adherido ✅'
          : (faltan.length ? 'Completa tu ficha para que podamos revisarla' : 'Pendiente de revisión por MOTOCLUBes')}</div>
        <div class="rf-banner-sub">${rfActive
          ? 'Los moteros ven tu ficha y tus ofertas'
          : (faltan.length
              ? 'Te falta: ' + faltan.join(', ') + '. <a href="perfil.html" style="color:var(--orange);font-weight:700">Ir a mi perfil</a>'
              : 'La revisamos y te avisamos cuando salgas en el mapa. Las ofertas son opcionales.')}</div>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">—</div><div class="stat-lbl">Visitas este mes</div></div>
      <div class="stat-card"><div class="stat-num">${canjes ?? 0}</div><div class="stat-lbl">Canjes este mes</div></div>
      <div class="stat-card"><div class="stat-num">${d.opiniones?.media != null ? Number(d.opiniones.media).toFixed(1) : (biz?.rating_avg ? biz.rating_avg.toFixed(1) : '—')}</div><div class="stat-lbl">Valoración media</div>${d.opiniones?.n ? '<div class="stat-lbl" data-noi18n>' + d.opiniones.n + (window.MC_LANG === 'en' ? (d.opiniones.n === 1 ? ' review' : ' reviews') : (d.opiniones.n === 1 ? ' opinión' : ' opiniones')) + '</div>' : ''}</div>
    </div>
    <div class="btn-row">
      <a href="perfil.html" class="btn-outline">✏️ Editar perfil</a>
      <a href="ofertas.html" class="btn-primary">+ Nueva oferta</a>
    </div>
    ${(d.cambios || []).some(c => c.estado === 'pendiente') ? `<a href="perfil.html" style="display:block;margin:0 0 16px;padding:12px 14px;border-radius:12px;background:rgba(245,197,24,.16);border:1px solid rgba(245,197,24,.55);color:#7A5C00;text-decoration:none;font-size:14px">🕒 <b>Tienes cambios pendientes de revisión.</b> En la app sigue lo de antes hasta que los revisemos; te avisamos por correo.</a>` : ''}
    ${(d.cambios || []).filter(c => c.estado === 'rechazado').slice(0, 1).map(c => `<a href="perfil.html" style="display:block;margin:0 0 16px;padding:12px 14px;border-radius:12px;background:rgba(214,58,58,.10);border:1px solid rgba(214,58,58,.35);color:var(--red);text-decoration:none;font-size:14px">✋ <b>No hemos publicado un cambio:</b> ${String(c.motivo || '').replace(/</g, '&lt;')}</a>`).join('')}
    <!-- MC-RF-CAMBIOS-1OCT-2026 (92.ª, RF-REVISION-CAMBIOS-1) -->
    ${d.qr_pendientes ? `<a href="ofertas.html" style="display:block;margin:0 0 16px;padding:12px 14px;border-radius:12px;background:rgba(255,122,26,.10);color:var(--black);text-decoration:none;font-size:14px">📱 <b>${d.qr_pendientes}</b> ${d.qr_pendientes === 1 ? 'motero tiene su QR' : 'moteros tienen su QR'} sin canjear todavía. <span style="color:var(--orange);font-weight:700">Ver quiénes</span></a>` : ''}
    <!-- MC-RF-RESPUESTAS-13OCT-2026 (107.ª, RF-RESPUESTAS-1): las opiniones de los moteros y contestarlas -->
    <div id="opiniones-panel"></div>
    ${d.opiniones?.n ? '' : '<div class="empty-state" style="margin-bottom:24px">Todavía no os ha valorado ningún motero. Cuando lo haga, saldrá aquí, podréis contestarle y os llegará un correo.</div>'}
    <div class="section-title">Últimas ofertas</div>
    <div class="ofertas-list">
      ${ofertas && ofertas.length > 0
        ? ofertas.map(o => `
          <div class="oferta-item">
            <div class="oferta-pct">${o.discount_pct ? o.discount_pct + '%' : (o.fixed_price ? o.fixed_price + '€' : '🎁')}</div>
            <div class="oferta-info">
              <div class="oferta-title">${o.title}</div>
              <div class="oferta-meta">${!o.ends_at || new Date(o.ends_at).getFullYear() >= 2099 ? 'Sin caducidad' : 'Hasta ' + new Date(o.ends_at).toLocaleDateString('es-ES')} · ${o.uses_count ?? 0} canjes</div>
            </div>
            <span class="badge ${o.is_active ? 'on' : 'off'}">${o.is_active ? 'Activa' : 'Borrador'}</span>
          </div>`).join('')
        : '<div class="empty-state">Aún no tienes ofertas publicadas.<br>Las ofertas son opcionales, pero son lo que más llama la atención de los moteros. Te recomendamos crear al menos una.</div>'
      }
    </div>
    <button class="btn-ghost" onclick="window.location.href='mailto:negocios@motoclubes.es'">✉️ Contactar con MOTOCLUBes</button>
  `
  pintarOpiniones(d.opiniones)
}
// MC-RF-RESPUESTAS-13OCT-2026 (107.ª, RF-RESPUESTAS-1). Mario: «que pueda comentar y agradecer y que aparezcan en la app
// los comentarios de los negocios». Cada opinión lleva «Responder» (o la respuesta, con «Cambiar»). La respuesta sale en la
// app debajo de la opinión y al motero le llega un aviso la primera vez. El bloque va sin traducir (data-noi18n, lo
// escrito por los moteros): los rótulos salen según MC_LANG.
function pintarOpiniones(op) {
  const cont = document.getElementById('opiniones-panel')
  if (!cont) return
  const en = window.MC_LANG === 'en'
  const T = en
    ? { responder: 'Reply', cambiar: 'Edit', quitar: 'Remove reply', publicar: 'Publish reply', guardando: 'Saving…', cancelar: 'Cancel',
        vuestra: 'Your reply', pista: 'The rider will see it in the app, under their review.', hueco: 'Thank them, answer what they said…' }
    : { responder: 'Responder', cambiar: 'Cambiar', quitar: 'Quitar respuesta', publicar: 'Publicar respuesta', guardando: 'Guardando…', cancelar: 'Cancelar',
        vuestra: 'Vuestra respuesta', pista: 'La verá el motero en la app, debajo de su opinión.', hueco: 'Agradecedle la visita, contestad a lo que dice…' }
  const boton = (txt, principal) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = txt
    b.style.cssText = principal
      ? 'background:var(--orange);color:#fff;border:none;padding:9px 18px;border-radius:50px;font:700 13px Manrope,sans-serif;cursor:pointer'
      : 'background:transparent;color:var(--orange);border:1.5px solid var(--orange);padding:8px 16px;border-radius:50px;font:600 13px Manrope,sans-serif;cursor:pointer'
    return b
  }
  mcOpiniones(cont, op, (o, div) => {
    const zona = document.createElement('div'); zona.style.cssText = 'margin:10px 0 6px'
    div.appendChild(zona)
    let editar
    const ver = () => {
      zona.innerHTML = ''
      if (o.respuesta) {
        const r = document.createElement('div')
        r.style.cssText = 'border-left:3px solid var(--orange);padding:6px 10px;margin-bottom:8px;font-size:14px;line-height:1.5;white-space:pre-line'
        const t = document.createElement('div'); t.style.cssText = 'font-size:12px;font-weight:700;color:var(--orange);margin-bottom:2px'; t.textContent = T.vuestra
        r.appendChild(t); r.appendChild(document.createTextNode(o.respuesta)); zona.appendChild(r)
      }
      const b = boton(o.respuesta ? T.cambiar : T.responder, !o.respuesta)
      b.onclick = editar; zona.appendChild(b)
    }
    editar = () => {
      zona.innerHTML = ''
      const ta = document.createElement('textarea'); ta.maxLength = 1000; ta.rows = 3; ta.value = o.respuesta || ''; ta.placeholder = T.hueco
      ta.style.cssText = 'width:100%;padding:10px 12px;font:14px Manrope,sans-serif;border-radius:10px;border:1.5px solid var(--card);background:var(--white);color:var(--black);resize:vertical'
      const pista = document.createElement('div'); pista.style.cssText = 'font-size:12px;color:var(--gray-light);margin:4px 0 8px'; pista.textContent = T.pista
      const fila = document.createElement('div'); fila.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap'
      const pub = boton(T.publicar, true)
      const guardar = async (texto) => {
        fila.querySelectorAll('button').forEach((x) => { x.disabled = true }); pub.textContent = T.guardando
        try { const r = await api('opinion_responder', { id: o.id, texto }); o.respuesta = r.respuesta || null; ver() }
        catch (e) { alert(e.message); fila.querySelectorAll('button').forEach((x) => { x.disabled = false }); pub.textContent = T.publicar }
      }
      pub.onclick = () => { if (ta.value.trim()) guardar(ta.value.trim()) }
      const can = boton(T.cancelar, false); can.onclick = ver
      fila.appendChild(pub); fila.appendChild(can)
      if (o.respuesta) { const q = boton(T.quitar, false); q.onclick = () => guardar(''); fila.appendChild(q) }
      zona.appendChild(ta); zona.appendChild(pista); zona.appendChild(fila); ta.focus()
    }
    ver()
  })
}
loadPanel()
</script>
<script src="/assets/visita.js" defer></script>
</body>
</html>
