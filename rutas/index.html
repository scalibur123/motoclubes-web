<script>
/* Página pública de una ruta.
   Entra por  /rutas/?id=<uuid>  — no por /rutas/<uuid>: GitHub Pages es estático y
   una ruta inventada devolvería 404, que rompe la vista previa del enlace en WhatsApp
   y en los foros. Con ?id= siempre hay un 200.
   Los datos NO se leen de la tabla `routes` con la clave anónima: `routes` no tiene
   ninguna política para `anon`. Se leen por la puerta estrecha `mc_ruta_publica(uuid)`,
   que sólo devuelve rutas con is_public = true y sólo los campos de esta página. */

var SB_URL = "https://yxmirhpwmdmaxynlshdx.supabase.co";
var SB_KEY = "sb_publishable_qfrmrp5BiNcg1U0gFtA78w_oRAMGzDi";

var lienzo = document.getElementById("lienzo");
var id = new URLSearchParams(location.search).get("id");

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function fallo(msg) {
  lienzo.innerHTML =
    '<div class="error"><p style="font-size:18px;font-weight:700;color:#fff;margin-bottom:10px">' +
    esc(msg) + "</p>" +
    '<p>Puede que la ruta ya no sea pública o que el enlace esté incompleto.</p>' +
    '<p style="margin-top:24px"><a class="boton boton-principal" href="../">Ir a MOTOCLUBes</a></p></div>';
}

/* Todos los puntos de la ruta: primero las etapas (ruta de varios días),
   si no las hay, los puntos sueltos, y si no, lo que se pueda sacar del GPX guardado. */
function puntosDe(r) {
  var out = [];
  if (r.stages && r.stages.length) {
    r.stages.forEach(function (s) {
      if (Array.isArray(s.points)) s.points.forEach(function (p) { out.push(p); });
    });
  }
  if (!out.length && Array.isArray(r.points)) out = r.points.slice();
  if (!out.length && r.gpx) {
    var re = /<(?:trkpt|wpt|rtept)\s+lat="([\-\d.]+)"\s+lon="([\-\d.]+)"/gi, m;
    while ((m = re.exec(r.gpx))) out.push({ lat: parseFloat(m[1]), lng: parseFloat(m[2]) });
  }
  return out.filter(function (p) { return p && isFinite(p.lat) && isFinite(p.lng); });
}

/* Trazado en SVG puro: sin mapa base y por tanto sin cargas de Mapbox facturables
   por cada persona que abra el enlace en un foro. Se ve la forma de la ruta, que es
   lo que el motero quiere ver antes de descargarse el GPX. */
function dibujar(pts) {
  if (pts.length < 2) return "";
  var W = 1000, H = 520, M = 26;
  var latMin = 90, latMax = -90, lngMin = 180, lngMax = -180;
  pts.forEach(function (p) {
    if (p.lat < latMin) latMin = p.lat; if (p.lat > latMax) latMax = p.lat;
    if (p.lng < lngMin) lngMin = p.lng; if (p.lng > lngMax) lngMax = p.lng;
  });
  var latMed = ((latMin + latMax) / 2) * Math.PI / 180;
  var anchoGeo = Math.max((lngMax - lngMin) * Math.cos(latMed), 1e-9);
  var altoGeo = Math.max(latMax - latMin, 1e-9);
  var k = Math.min((W - 2 * M) / anchoGeo, (H - 2 * M) / altoGeo);
  var dx = (W - anchoGeo * k) / 2, dy = (H - altoGeo * k) / 2;
  function X(p) { return dx + (p.lng - lngMin) * Math.cos(latMed) * k; }
  function Y(p) { return dy + (latMax - p.lat) * k; }

  /* Con 30.000 puntos el SVG pesaría megas: se adelgaza a ~1.200 conservando extremos. */
  var paso = Math.max(1, Math.floor(pts.length / 1200));
  var fino = [];
  for (var i = 0; i < pts.length; i += paso) fino.push(pts[i]);
  if (fino[fino.length - 1] !== pts[pts.length - 1]) fino.push(pts[pts.length - 1]);

  var d = fino.map(function (p, i) {
    return (i ? "L" : "M") + X(p).toFixed(1) + " " + Y(p).toFixed(1);
  }).join(" ");
  var a = pts[0], b = pts[pts.length - 1];

  return '<div class="trazado"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Trazado de la ruta">' +
    '<path d="' + d + '" fill="none" stroke="#FF7A1A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + X(a).toFixed(1) + '" cy="' + Y(a).toFixed(1) + '" r="10" fill="#FF7A1A" stroke="#0E0E0E" stroke-width="4"/>' +
    '<circle cx="' + X(b).toFixed(1) + '" cy="' + Y(b).toFixed(1) + '" r="10" fill="#fff" stroke="#0E0E0E" stroke-width="4"/>' +
    "</svg></div>";
}

/* 🗺️ WEB-RUTA-MAPA-1 (22-sep). Mario, viendo esta pagina: «es una pantalla negra [...] el mapa tiene que verse [...]
   si la costa está a la derecha, debería aparecer Valencia; si Teruel está arriba, debería aparecer Teruel, aunque no
   pase, pero para ubicarme». Hasta hoy era solo el SVG de arriba, a proposito, para no pagar cargas de Mapbox por
   visita; Mario decide pagarlas (50.000 al mes gratis; ver COSTES). El SVG se queda como PLAN B si el mapa no carga.
   📌 El trazo va en MORADO, como la ficha de la app: sobre el estilo de calles Mapbox pinta las autovias en naranja
   y un trazo naranja se pierde (FICHA-NARANJA-1).
   📌 `cooperativeGestures`: en el movil, un dedo hace scroll de la pagina y dos dedos mueven el mapa. */
var MAPBOX_TOKEN = "pk.eyJ1IjoibW90b2NsdWJlcyIsImEiOiJjbXA2cmJxaTUwM3djMnJzZXlvMzBycGg0In0.dw_0jtLStDE_MyCAm6zOig";
var COLOR_RUTA = "#7C3AED";

function pinAB(letra, nombre, color) {
  var el = document.createElement("div");
  el.className = "pin-ab";
  el.innerHTML = '<b style="background:' + color + '">' + letra + "</b>" + (nombre ? "<span>" + esc(nombre) + "</span>" : "");
  return el;
}

/* 🆕 WEB-RUTA-DETALLE-1: el mapa queda a mano para ponerle las paradas y, cuando lleguen, los puertos. */
var MAPA = null, MAPA_LISTO = false, PENDIENTES_MAPA = [];
function enMapa(fn) { if (MAPA && MAPA_LISTO) fn(MAPA); else PENDIENTES_MAPA.push(fn); }
function pinesParadas(map, lista) {
  lista.forEach(function (p) {
    if (p.inicio || p.fin) return; // A y B ya tienen su pin
    var el = document.createElement("div");
    el.className = "pin-parada";
    el.style.background = p.t.c;
    el.textContent = p.t.e;
    var pop = new mapboxgl.Popup({ offset: 16, closeButton: false })
      .setHTML('<b style="color:#111">' + esc(p.nombre) + '</b><br><span style="color:#555">km ' + fmtMiles(p.km) + "</span>");
    new mapboxgl.Marker({ element: el }).setLngLat([p.w.lng, p.w.lat]).setPopup(pop).addTo(map);
  });
}
function pinesPuertos(map, ps) {
  ps.forEach(function (p) {
    var el = document.createElement("div");
    el.className = "pin-puerto";
    el.innerHTML = "<i>🏔️</i><span>" + esc(p.name) + " · " + fmtMiles(p.ele) + " m</span>";
    var pop = new mapboxgl.Popup({ offset: 16, closeButton: false })
      .setHTML('<b style="color:#111">' + esc(p.name) + '</b><br><span style="color:#555">' + fmtMiles(p.ele) + " m · km " + fmtMiles(p.km) + "</span>");
    new mapboxgl.Marker({ element: el, anchor: "top", offset: [0, -12] }).setLngLat([p.lng, p.lat]).setPopup(pop).addTo(map);
  });
  // Los nombres solo con el mapa acercado (zoom 9 o más): alejado se pisan unos a otros.
  var caja = map.getContainer();
  function etiquetas() { caja.classList.toggle("sin-etiquetas", map.getZoom() < 9); }
  etiquetas();
  map.on("zoomend", etiquetas);
}

function mapaReal(r, pts) {
  var caja = document.getElementById("mapa");
  if (!caja) return;
  function planB() { caja.outerHTML = dibujar(pts); }
  if (typeof mapboxgl === "undefined" || pts.length < 2) { planB(); return; }
  try {
    mapboxgl.accessToken = MAPBOX_TOKEN;
    var paso = Math.max(1, Math.floor(pts.length / 2500));
    var fino = [];
    for (var i = 0; i < pts.length; i += paso) fino.push([pts[i].lng, pts[i].lat]);
    var ult = pts[pts.length - 1];
    fino.push([ult.lng, ult.lat]);
    var bounds = fino.reduce(function (b, c) { return b.extend(c); }, new mapboxgl.LngLatBounds(fino[0], fino[0]));
    var map = new mapboxgl.Map({
      container: caja,
      style: "mapbox://styles/mapbox/streets-v12",
      bounds: bounds,
      fitBoundsOptions: { padding: 50, maxZoom: 13 },
      // 🆕 WEB-MAPA-FIJO-1 (25-sep). Mario: «el mapa se sigue moviendo [...] me gustaría que fuera más bien fijo [...]
      // al pasar sin querer le das». Fuera arrastrar, rueda, doble toque, pellizco y girar: el mapa se queda quieto
      // encuadrando la ruta. Se acerca y aleja SOLO con los botones + y −, y los pines siguen abriendo su globo.
      dragPan: false, scrollZoom: false, boxZoom: false, dragRotate: false, keyboard: false,
      doubleClickZoom: false, touchZoomRotate: false, touchPitch: false,
      attributionControl: false
    });
    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");
    map.addControl(new mapboxgl.AttributionControl({ compact: true }));
    var cargado = false;
    map.on("error", function () { if (!cargado) { try { map.remove(); } catch (e) {} planB(); } });
    MAPA = map;
    map.on("load", function () {
      cargado = true;
      MAPA_LISTO = true;
      setTimeout(function () { PENDIENTES_MAPA.splice(0).forEach(function (fn) { try { fn(map); } catch (e) {} }); }, 0);
      map.addSource("ruta", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: fino } } });
      map.addLayer({ id: "ruta-borde", type: "line", source: "ruta", layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#ffffff", "line-width": 8 } });
      map.addLayer({ id: "ruta", type: "line", source: "ruta", layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": COLOR_RUTA, "line-width": 4.5 } });
      var a = pts[0], b = pts[pts.length - 1];
      var ini = r.municipio_inicio || r.provincia_inicio || "Salida";
      var fin = r.municipio_fin || r.provincia_fin || "Llegada";
      var mismoSitio = Math.abs(a.lat - b.lat) < 0.002 && Math.abs(a.lng - b.lng) < 0.002;
      if (mismoSitio) {
        new mapboxgl.Marker({ element: pinAB("A·B", ini, "#16A34A"), anchor: "left", offset: [-13, 0] }).setLngLat([a.lng, a.lat]).addTo(map);
      } else {
        new mapboxgl.Marker({ element: pinAB("A", ini, "#16A34A"), anchor: "left", offset: [-13, 0] }).setLngLat([a.lng, a.lat]).addTo(map);
        new mapboxgl.Marker({ element: pinAB("B", fin, "#DC2626"), anchor: "left", offset: [-13, 0] }).setLngLat([b.lng, b.lat]).addTo(map);
      }
    });
    // Si en 12 s no ha llegado el mapa (sin cobertura, bloqueo), plan B: el dibujo de siempre.
    setTimeout(function () { if (!cargado) { try { map.remove(); } catch (e) {} planB(); } }, 12000);
  } catch (e) {
    planB();
  }
}

/* 🆕 WEB-RUTA-DETALLE-1 (25-sep, 74.ª). Mario: «que puedan ver [...] la ruta editada con el detalle de todas las
   gasolineras, restaurantes, puertos». Decidido con él: se ENSEÑA TODO (pines, contadores y lista con nombres):
   en el foro BMWMOTOS le tienen que poder decir qué puerto falta y cuál sobra.
   ⚠️ COPIA DELIBERADA de `WAYPOINT_TYPES` (motoclubes-v2 `src/lib/waypoint-types.ts`), como la del correo
   (`notify-salida`): esta web no puede importar `src/`. Si se toca allí, se toca aquí.
   Las paradas llegan YA FILTRADAS de `mc_ruta_publica` (regla `paradasUtiles`, en la base). */
var TIPOS = {
  gasolinera:    { e: "⛽",  c: "#FF7A1A", l: "Gasolinera" },
  restaurante:   { e: "🍽️", c: "#FF7A1A", l: "Restaurante" },
  hotel:         { e: "🏨",  c: "#FF7A1A", l: "Hotel" },
  camping:       { e: "⛺",  c: "#FF7A1A", l: "Camping" },
  mirador:       { e: "👁️", c: "#F59E0B", l: "Mirador" },
  taller:        { e: "🔧",  c: "#FF7A1A", l: "Taller" },
  hospital:      { e: "➕",  c: "#E5354A", l: "Hospital" },
  lugar_interes: { e: "📷",  c: "#F59E0B", l: "Lugar de interés" },
  puerto:        { e: "🏔️", c: "#7C3AED", l: "Puerto" }
};
var ORDEN_TIPOS = ["gasolinera", "restaurante", "hotel", "camping", "puerto", "mirador", "lugar_interes", "taller", "hospital"];
var PASADA = { e: "📍", c: "#FF7A1A", l: "Punto de pasada" };
function tipoDe(w) { return TIPOS[w && w.waypointType] || PASADA; }
function nombreParada(w, i, n) {
  var t = String((w && w.name) || "").trim();
  if (/^Punto\s+\d+$/i.test(t)) t = "";
  return t || (i === 0 ? "Salida" : i === n - 1 ? "Llegada" : tipoDe(w).l);
}
function fmtMiles(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); }

/* Km en los que cae cada punto: mismo cálculo que la app (`puertos-ruta.ts`: contra SEGMENTOS, pasada gruesa y
   fina). Gratis: sale del trazado ya descargado. */
function hav(a, b) {
  var R = 6371, r = Math.PI / 180;
  var x = Math.pow(Math.sin((b.lat - a.lat) * r / 2), 2) +
          Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.pow(Math.sin((b.lng - a.lng) * r / 2), 2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
function kmAcum(t) {
  var out = [0];
  for (var i = 1; i < t.length; i++) out.push(out[i - 1] + hav(t[i - 1], t[i]));
  return out;
}
function kmSeg(p, a, b) {
  var k = 111.32, c = Math.cos(p.lat * Math.PI / 180);
  var ax = (a.lng - p.lng) * c * k, ay = (a.lat - p.lat) * k, bx = (b.lng - p.lng) * c * k, by = (b.lat - p.lat) * k;
  var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  var t = l2 > 0 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
  return Math.hypot(ax + t * dx, ay + t * dy);
}
function tramoCerca(t, p) {
  if (t.length < 2) return { i: 0, km: Infinity };
  var paso = Math.max(1, Math.floor(t.length / 2000)), mi = 0, md = Infinity, i, d;
  for (i = 0; i < t.length - 1; i += paso) {
    d = kmSeg(p, t[i], t[Math.min(i + paso, t.length - 1)]);
    if (d < md) { md = d; mi = i; }
  }
  if (paso > 1) {
    var desde = Math.max(0, mi - 2 * paso), hasta = Math.min(t.length - 1, mi + 3 * paso);
    for (i = desde; i < hasta; i++) { d = kmSeg(p, t[i], t[i + 1]); if (d < md) { md = d; mi = i; } }
  }
  return { i: mi, km: md };
}

/* 🆕 RUTA-PUERTOS-LEYENDA-1 (25-sep, 74.ª). Los puertos por los que pasa la carretera, con su altura. Misma regla
   que la ficha de la app (`puertos-ruta.ts`, `PUERTO_MIN_ELE` y `PUERTO_MAX_KM`): tabla `puertos`, de 800 m para
   arriba, a 300 m o menos del trazado, en orden de paso. `anon` lee `puertos` (medido el 25-sep: GRANT + RLS). */
var PUERTO_MIN_ELE = 800, PUERTO_MAX_KM = 0.3;
function puertosEnRuta(t) {
  if (t.length < 2) return Promise.resolve([]);
  var la1 = 90, la2 = -90, lo1 = 180, lo2 = -180;
  t.forEach(function (p) { la1 = Math.min(la1, p.lat); la2 = Math.max(la2, p.lat); lo1 = Math.min(lo1, p.lng); lo2 = Math.max(lo2, p.lng); });
  var m = 0.012;
  var q = "select=id,name,lat,lng,ele&ele=gte." + PUERTO_MIN_ELE +
          "&lat=gte." + (la1 - m) + "&lat=lte." + (la2 + m) + "&lng=gte." + (lo1 - m) + "&lng=lte." + (lo2 + m) + "&limit=5000";
  return fetch(SB_URL + "/rest/v1/puertos?" + q, { headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } })
    .then(function (res) { return res.ok ? res.json() : []; })
    .then(function (filas) {
      var acum = kmAcum(t), out = [];
      (Array.isArray(filas) ? filas : []).forEach(function (pu) {
        var c = tramoCerca(t, pu);
        if (c.km <= PUERTO_MAX_KM) out.push({ name: pu.name, ele: pu.ele, lat: pu.lat, lng: pu.lng, km: acum[c.i] || 0 });
      });
      return out.sort(function (a, b) { return a.km - b.km; });
    })
    .catch(function () { return []; });
}

/* Las paradas con su km, en orden de la ruta. */
function paradasConKm(r, pts) {
  var ps = Array.isArray(r.paradas) ? r.paradas : [];
  if (!ps.length || pts.length < 2) return [];
  var acum = kmAcum(pts), n = ps.length;
  return ps.map(function (w, i) {
    var km = i === 0 ? 0 : (acum[tramoCerca(pts, w).i] || 0);
    return { w: w, i: i, km: km, t: tipoDe(w), nombre: nombreParada(w, i, n), inicio: i === 0, fin: i === n - 1 && n > 1 };
  });
}

function htmlParadas(lista) {
  if (!lista.length) return "";
  var cuenta = {};
  lista.forEach(function (p) { if (!p.inicio && !p.fin && p.w.waypointType) cuenta[p.w.waypointType] = (cuenta[p.w.waypointType] || 0) + 1; });
  var chips = ORDEN_TIPOS.filter(function (k) { return cuenta[k]; })
    .map(function (k) { return "<span>" + TIPOS[k].e + " " + cuenta[k] + " · " + esc(TIPOS[k].l) + "</span>"; }).join("");
  var filas = lista.map(function (p) {
    var ico = p.inicio ? (p.w.waypointType ? p.t.e : "") + "🏁" : p.fin ? (p.w.waypointType ? p.t.e : "") + "🚩" : p.t.e;
    return '<li><span class="km">' + (p.inicio ? "km 0" : "km " + fmtMiles(p.km)) + '</span><span class="ico">' + ico +
      '</span><span class="nom">' + esc(p.nombre) + "</span></li>";
  }).join("");
  return '<div class="bloque"><h2>Paradas</h2>' +
    (chips ? '<div class="contadores" style="margin:0 0 14px">' + chips + "</div>" : "") +
    '<ul class="lista">' + filas + "</ul></div>";
}

function htmlPuertos(ps) {
  if (!ps.length) return "";
  var filas = ps.map(function (p) {
    return '<li><span class="km">km ' + fmtMiles(p.km) + '</span><span class="ico">🏔️</span><span class="nom">' +
      esc(p.name) + '</span><span class="alt">' + fmtMiles(p.ele) + " m</span></li>";
  }).join("");
  var alto = ps.reduce(function (a, b) { return b.ele > a.ele ? b : a; }, ps[0]);
  return '<h2>Puertos por los que pasa</h2><p class="sub">' + ps.length + (ps.length === 1 ? " puerto" : " puertos") +
    " de 800 m o más sobre la carretera. El más alto: " + esc(alto.name) + " (" + fmtMiles(alto.ele) + " m).</p>" +
    '<ul class="lista">' + filas + "</ul>";
}

/* Las otras etapas: las de la salida de grupo o las de la multietapa. Solo llegan las PÚBLICAS. */
function htmlEtapas(r) {
  var s = r.salida && Array.isArray(r.salida.etapas) && r.salida.etapas.length > 1 ? r.salida : null;
  var me = !s && Array.isArray(r.multietapa) && r.multietapa.length > 1 ? r.multietapa : null;
  if (!s && !me) return "";
  var items = s ? s.etapas.map(function (e) { return { id: e.id, rot: "Día " + e.dia, title: e.title, km: e.km }; })
                : me.map(function (e) { return { id: e.id, rot: e.etapa ? "Etapa " + e.etapa : "Completa", title: e.title, km: e.km }; });
  var filas = items.map(function (e) {
    var yo = e.id === r.id;
    return '<li class="' + (yo ? "actual" : "") + '"><a href="?id=' + esc(e.id) + '"><span class="km">' + esc(e.rot) +
      '</span><span class="nom">' + esc(e.title) + '</span><span class="alt">' + (e.km != null ? fmtMiles(e.km) + " km" : "") +
      "</span></a></li>";
  }).join("");
  return '<div class="bloque"><h2>' + (s ? "Etapas de «" + esc(s.nombre) + "»" : "Etapas") + "</h2>" +
    '<ul class="lista">' + filas + "</ul></div>";
}

function duracion(min) {
  if (!min && min !== 0) return "—";
  var h = Math.floor(min / 60), m = Math.round(min % 60);
  return h ? h + " h " + (m ? m + " min" : "") : m + " min";
}

/* 🆕 WEB-RUTA-DETALLE-1: el GPX lleva las paradas como <wpt>, como el de la app (`ruta-gpx.ts`). Antes devolvía
   `routes.gpx` si existía (solo lo rellena una GRABACIÓN) y si no, la línea pelada: el forero de TomTom o de Garmin
   se bajaba la ruta sin una gasolinera ni un puerto (FORO-BMWMOTOS-1). */
function construirGpx(r, pts) {
  var paradas = Array.isArray(r.paradas) ? r.paradas : [];
  var wpts = paradas.map(function (w, i) {
    return '  <wpt lat="' + w.lat + '" lon="' + w.lng + '"><name>' + esc(nombreParada(w, i, paradas.length)) +
      '</name><type>' + esc(tipoDe(w).l) + '</type></wpt>';
  }).join("\n");
  var cab = '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<gpx version="1.1" creator="MOTOCLUBes" xmlns="http://www.topografix.com/GPX/1/1">\n' +
    "  <metadata><name>" + esc(r.title) + "</name>" +
    '<link href="https://www.motoclubes.es"><text>MOTOCLUBes</text></link></metadata>\n' +
    (wpts ? wpts + "\n" : "") +
    "  <trk><name>" + esc(r.title) + "</name><trkseg>\n";
  var cuerpo = pts.map(function (p) {
    return '    <trkpt lat="' + p.lat + '" lon="' + p.lng + '"></trkpt>';
  }).join("\n");
  return cab + cuerpo + "\n  </trkseg></trk>\n</gpx>\n";
}

function pintar(r) {
  var pts = puntosDe(r);
  var paradas = paradasConKm(r, pts); // WEB-RUTA-DETALLE-1
  var origen = r.municipio_inicio || r.provincia_inicio || "";
  var destino = r.municipio_fin || r.provincia_fin || "";
  var tramo = origen && destino ? esc(origen) + " → " + esc(destino) : esc(origen || destino);
  var autor = r.autor ? "Compartida por " + esc(r.autor) : "Compartida en MOTOCLUBes";

  var datos = [
    [r.km != null ? Number(r.km).toFixed(0) + " km" : "—", "Distancia"],
    [duracion(r.moving_time_minutes != null ? r.moving_time_minutes : r.duration_minutes), "Tiempo"],
    [r.curves_count ? r.curves_count : "—", "Curvas"],
    [r.elevation_gain_m != null ? r.elevation_gain_m + " m" : "—", "Desnivel"],
    [r.dias && r.dias > 1 ? r.dias + " días" : "1 día", "Duración"]
  ].map(function (x) {
    return '<div class="dato"><b>' + esc(x[0]) + "</b><span>" + esc(x[1]) + "</span></div>";
  }).join("");

  lienzo.innerHTML =
    '<div class="ruta-cab"><h1>' + esc(r.title) + "</h1>" +
    '<p class="ruta-meta">' + (tramo ? tramo + " · " : "") + autor + "</p></div>" +
    (pts.length >= 2 ? '<div class="trazado mapa-real" id="mapa"></div>' : "") + // WEB-RUTA-MAPA-1
    '<div class="datos">' + datos + "</div>" +
    (r.description ? '<p class="entradilla" style="margin-top:24px">' + esc(r.description) + "</p>" : "") +
    '<div class="acciones" style="justify-content:flex-start;margin-top:30px">' +
      (pts.length ? '<a class="boton boton-principal" id="bajar" href="#">⬇ Descargar GPX</a>' : "") +
      '<a class="boton boton-suave" href="motoclubes://ruta/' + esc(r.id) + '">Abrir en la app</a>' +
      '<a class="boton boton-suave" href="../#descarga">No tengo la app</a>' +
    "</div>" +
    '<p class="aviso-beta" style="margin:18px 0 0">El GPX se descarga sin cuenta y sin registro, con las paradas dentro. ' +
    'Para navegarla con indicaciones, rodarla en grupo y hablar por el intercom, hace falta la app.</p>' +
    htmlEtapas(r) +                                   // WEB-RUTA-DETALLE-1
    '<div class="bloque" id="puertos"></div>' + // RUTA-PUERTOS-LEYENDA-1 (se rellena al llegar). DIV y no SECTION: mc.css da a
                                                //  todo <section> 74 px de relleno y raya arriba (huecos vistos por Mario, 25-sep)
    htmlParadas(paradas) +                            // WEB-RUTA-DETALLE-1
    '<div style="height:60px"></div>';

  mapaReal(r, pts); // WEB-RUTA-MAPA-1
  enMapa(function (map) { pinesParadas(map, paradas); });
  puertosEnRuta(pts).then(function (ps) {
    var caja = document.getElementById("puertos");
    if (caja) { if (ps.length) caja.innerHTML = htmlPuertos(ps); else caja.remove(); }
    if (ps.length) enMapa(function (map) { pinesPuertos(map, ps); });
  });

  var b = document.getElementById("bajar");
  if (b) b.addEventListener("click", function (e) {
    e.preventDefault();
    var blob = new Blob([construirGpx(r, pts)], { type: "application/gpx+xml" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (r.title || "ruta").replace(/[^\w\sáéíóúñÁÉÍÓÚÑ-]/g, "").trim().replace(/\s+/g, "_") + ".gpx";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });
}

if (!id || !/^[0-9a-f-]{36}$/i.test(id)) {
  fallo("No hay ninguna ruta en este enlace.");
} else {
  /* 🆕 WEB-RUTA-CARGA-1 (25-sep). Mario vio «No hemos podido cargar la ruta» dos veces seguidas en una ruta pública
     que un minuto antes cargaba; la misma petición abierta a mano (GET, con la clave en la dirección) SÍ contestó.
     Ahora: (1) GET con la clave publicable en la dirección y SIN cabeceras propias — sin la consulta previa del
     navegador (CORS), que es una pieza menos que puede fallar; es exactamente la dirección que funcionó; (2) si falla,
     UN reintento a los 1,5 s; (3) si vuelve a fallar, el código del error en pequeño, para saber qué ha pasado
     en vez de adivinarlo. La función es STABLE: PostgREST la acepta por GET. */
  var urlRuta = SB_URL + "/rest/v1/rpc/mc_ruta_publica?p_id=" + encodeURIComponent(id) + "&apikey=" + encodeURIComponent(SB_KEY);
  var pedir = function () {
    return fetch(urlRuta).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  };
  pedir()
    .catch(function () { return new Promise(function (ok) { setTimeout(ok, 1500); }).then(pedir); })
    .then(function (r) {
      if (!r || !r.id) { fallo("Esta ruta no está disponible."); return; }
      document.title = r.title + " · MOTOCLUBes";
      pintar(r);
    })
    .catch(function (e) {
      fallo("No hemos podido cargar la ruta.");
      var p = document.createElement("p");
      p.style.cssText = "margin-top:14px;font-size:12px;color:var(--texto-3)";
      p.textContent = "Detalle: " + String((e && e.message) || e);
      var caja = lienzo.querySelector(".error");
      if (caja) caja.appendChild(p);
    });
}
</script>
