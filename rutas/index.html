  .pin-ab b{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;

<body>

<footer>

    </div>
  </div>
</footer>

<script>
/* Página pública de una ruta.
   Entra por  /rutas/?id=<uuid>  — no por /rutas/<uuid>: GitHub Pages es estático y
   una ruta inventada devolvería 404, que rompe la vista previa del enlace en WhatsApp
   y en los foros. Con ?id= siempre hay un 200.
   Los datos NO se leen de la tabla `routes` con la clave anónima: `routes` no tiene
   ninguna política para `anon`. Se leen por la puerta estrecha `mc_ruta_publica(uuid)`,
   que sólo devuelve rutas con is_public = true y sólo los campos de esta página. */

var SB_URL = "https://yxmirhpwmdmaxynlshdx.supabase.co";
var SB_KEY = "sb_publishable_qfrmrp5BiNcg1U0gFtA78w_oRAMGzDi";

var lienzo = document.getElementById("lienzo");
var id = new URLSearchParams(location.search).get("id");

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function fallo(msg) {
  lienzo.innerHTML =
    '<div class="error"><p style="font-size:18px;font-weight:700;color:#fff;margin-bottom:10px">' +
    esc(msg) + "</p>" +
    '<p>Puede que la ruta ya no sea pública o que el enlace esté incompleto.</p>' +
    '<p style="margin-top:24px"><a class="boton boton-principal" href="../">Ir a MOTOCLUBes</a></p></div>';
}

/* Todos los puntos de la ruta: primero las etapas (ruta de varios días),
   si no las hay, los puntos sueltos, y si no, lo que se pueda sacar del GPX guardado. */
function puntosDe(r) {
  var out = [];
  if (r.stages && r.stages.length) {
    r.stages.forEach(function (s) {
      if (Array.isArray(s.points)) s.points.forEach(function (p) { out.push(p); });
    });
  }
  if (!out.length && Array.isArray(r.points)) out = r.points.slice();
  if (!out.length && r.gpx) {
    var re = /<(?:trkpt|wpt|rtept)\s+lat="([\-\d.]+)"\s+lon="([\-\d.]+)"/gi, m;
    while ((m = re.exec(r.gpx))) out.push({ lat: parseFloat(m[1]), lng: parseFloat(m[2]) });
  }
  return out.filter(function (p) { return p && isFinite(p.lat) && isFinite(p.lng); });
}

/* Trazado en SVG puro: sin mapa base y por tanto sin cargas de Mapbox facturables
   por cada persona que abra el enlace en un foro. Se ve la forma de la ruta, que es
   lo que el motero quiere ver antes de descargarse el GPX. */
function dibujar(pts) {
  if (pts.length < 2) return "";
  var W = 1000, H = 520, M = 26;
  var latMin = 90, latMax = -90, lngMin = 180, lngMax = -180;
  pts.forEach(function (p) {
    if (p.lat < latMin) latMin = p.lat; if (p.lat > latMax) latMax = p.lat;
    if (p.lng < lngMin) lngMin = p.lng; if (p.lng > lngMax) lngMax = p.lng;
  });
  var latMed = ((latMin + latMax) / 2) * Math.PI / 180;
  var anchoGeo = Math.max((lngMax - lngMin) * Math.cos(latMed), 1e-9);
  var altoGeo = Math.max(latMax - latMin, 1e-9);
  var k = Math.min((W - 2 * M) / anchoGeo, (H - 2 * M) / altoGeo);
  var dx = (W - anchoGeo * k) / 2, dy = (H - altoGeo * k) / 2;
  function X(p) { return dx + (p.lng - lngMin) * Math.cos(latMed) * k; }
  function Y(p) { return dy + (latMax - p.lat) * k; }

  /* Con 30.000 puntos el SVG pesaría megas: se adelgaza a ~1.200 conservando extremos. */
  var paso = Math.max(1, Math.floor(pts.length / 1200));
  var fino = [];
  for (var i = 0; i < pts.length; i += paso) fino.push(pts[i]);
  if (fino[fino.length - 1] !== pts[pts.length - 1]) fino.push(pts[pts.length - 1]);

  var d = fino.map(function (p, i) {
    return (i ? "L" : "M") + X(p).toFixed(1) + " " + Y(p).toFixed(1);
  }).join(" ");
  var a = pts[0], b = pts[pts.length - 1];

  return '<div class="trazado"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Trazado de la ruta">' +
    '<path d="' + d + '" fill="none" stroke="#FF7A1A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + X(a).toFixed(1) + '" cy="' + Y(a).toFixed(1) + '" r="10" fill="#FF7A1A" stroke="#0E0E0E" stroke-width="4"/>' +
    '<circle cx="' + X(b).toFixed(1) + '" cy="' + Y(b).toFixed(1) + '" r="10" fill="#fff" stroke="#0E0E0E" stroke-width="4"/>' +
    "</svg></div>";
}

/* 🗺️ WEB-RUTA-MAPA-1 (22-sep). Mario, viendo esta pagina: «es una pantalla negra [...] el mapa tiene que verse [...]
   si la costa está a la derecha, debería aparecer Valencia; si Teruel está arriba, debería aparecer Teruel, aunque no
   pase, pero para ubicarme». Hasta hoy era solo el SVG de arriba, a proposito, para no pagar cargas de Mapbox por
   visita; Mario decide pagarlas (50.000 al mes gratis; ver COSTES). El SVG se queda como PLAN B si el mapa no carga.
   📌 El trazo va en MORADO, como la ficha de la app: sobre el estilo de calles Mapbox pinta las autovias en naranja
   y un trazo naranja se pierde (FICHA-NARANJA-1).
   📌 `cooperativeGestures`: en el movil, un dedo hace scroll de la pagina y dos dedos mueven el mapa. */
var MAPBOX_TOKEN = "pk.eyJ1IjoibW90b2NsdWJlcyIsImEiOiJjbXA2cmJxaTUwM3djMnJzZXlvMzBycGg0In0.dw_0jtLStDE_MyCAm6zOig";
var COLOR_RUTA = "#7C3AED";

function pinAB(letra, nombre, color) {
  var el = document.createElement("div");
  el.className = "pin-ab";
  el.innerHTML = '<b style="background:' + color + '">' + letra + "</b>" + (nombre ? "<span>" + esc(nombre) + "</span>" : "");
  return el;
}

function mapaReal(r, pts) {
  var caja = document.getElementById("mapa");
  if (!caja) return;
  function planB() { caja.outerHTML = dibujar(pts); }
  if (typeof mapboxgl === "undefined" || pts.length < 2) { planB(); return; }
  try {
    mapboxgl.accessToken = MAPBOX_TOKEN;
    var paso = Math.max(1, Math.floor(pts.length / 2500));
    var fino = [];
    for (var i = 0; i < pts.length; i += paso) fino.push([pts[i].lng, pts[i].lat]);
    var ult = pts[pts.length - 1];
    fino.push([ult.lng, ult.lat]);
    var bounds = fino.reduce(function (b, c) { return b.extend(c); }, new mapboxgl.LngLatBounds(fino[0], fino[0]));
    var map = new mapboxgl.Map({
      container: caja,
      style: "mapbox://styles/mapbox/streets-v12",
      bounds: bounds,
      fitBoundsOptions: { padding: 50, maxZoom: 13 },
      cooperativeGestures: true,
      attributionControl: false
    });
    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");
    map.addControl(new mapboxgl.AttributionControl({ compact: true }));
    var cargado = false;
    map.on("error", function () { if (!cargado) { try { map.remove(); } catch (e) {} planB(); } });
    map.on("load", function () {
      cargado = true;
      map.addSource("ruta", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: fino } } });
      map.addLayer({ id: "ruta-borde", type: "line", source: "ruta", layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#ffffff", "line-width": 8 } });
      map.addLayer({ id: "ruta", type: "line", source: "ruta", layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": COLOR_RUTA, "line-width": 4.5 } });
      var a = pts[0], b = pts[pts.length - 1];
      var ini = r.municipio_inicio || r.provincia_inicio || "Salida";
      var fin = r.municipio_fin || r.provincia_fin || "Llegada";
      var mismoSitio = Math.abs(a.lat - b.lat) < 0.002 && Math.abs(a.lng - b.lng) < 0.002;
      if (mismoSitio) {
        new mapboxgl.Marker({ element: pinAB("A·B", ini, "#16A34A"), anchor: "left", offset: [-13, 0] }).setLngLat([a.lng, a.lat]).addTo(map);
      } else {
        new mapboxgl.Marker({ element: pinAB("A", ini, "#16A34A"), anchor: "left", offset: [-13, 0] }).setLngLat([a.lng, a.lat]).addTo(map);
        new mapboxgl.Marker({ element: pinAB("B", fin, "#DC2626"), anchor: "left", offset: [-13, 0] }).setLngLat([b.lng, b.lat]).addTo(map);
      }
    });
    // Si en 12 s no ha llegado el mapa (sin cobertura, bloqueo), plan B: el dibujo de siempre.
    setTimeout(function () { if (!cargado) { try { map.remove(); } catch (e) {} planB(); } }, 12000);
  } catch (e) {
    planB();
  }
}

function duracion(min) {
  if (!min && min !== 0) return "—";
  var h = Math.floor(min / 60), m = Math.round(min % 60);
  return h ? h + " h " + (m ? m + " min" : "") : m + " min";
}

function construirGpx(r, pts) {
  if (r.gpx) return r.gpx;
  var cab = '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<gpx version="1.1" creator="MOTOCLUBes" xmlns="http://www.topografix.com/GPX/1/1">\n' +
    "  <metadata><name>" + esc(r.title) + "</name>" +
    '<link href="https://www.motoclubes.es"><text>MOTOCLUBes</text></link></metadata>\n' +
    "  <trk><name>" + esc(r.title) + "</name><trkseg>\n";
  var cuerpo = pts.map(function (p) {
    return '    <trkpt lat="' + p.lat + '" lon="' + p.lng + '"></trkpt>';
  }).join("\n");
  return cab + cuerpo + "\n  </trkseg></trk>\n</gpx>\n";
}

function pintar(r) {
  var pts = puntosDe(r);
  var origen = r.municipio_inicio || r.provincia_inicio || "";
  var destino = r.municipio_fin || r.provincia_fin || "";
  var tramo = origen && destino ? esc(origen) + " → " + esc(destino) : esc(origen || destino);
  var autor = r.autor ? "Compartida por " + esc(r.autor) : "Compartida en MOTOCLUBes";

  var datos = [
    [r.km != null ? Number(r.km).toFixed(0) + " km" : "—", "Distancia"],
    [duracion(r.moving_time_minutes != null ? r.moving_time_minutes : r.duration_minutes), "Tiempo"],
    [r.curves_count ? r.curves_count : "—", "Curvas"],
    [r.elevation_gain_m != null ? r.elevation_gain_m + " m" : "—", "Desnivel"],
    [r.dias && r.dias > 1 ? r.dias + " días" : "1 día", "Duración"]
  ].map(function (x) {
    return '<div class="dato"><b>' + esc(x[0]) + "</b><span>" + esc(x[1]) + "</span></div>";
  }).join("");

  lienzo.innerHTML =
    '<div class="ruta-cab"><h1>' + esc(r.title) + "</h1>" +
    '<p class="ruta-meta">' + (tramo ? tramo + " · " : "") + autor + "</p></div>" +
    (pts.length >= 2 ? '<div class="trazado mapa-real" id="mapa"></div>' : "") + // WEB-RUTA-MAPA-1
    '<div class="datos">' + datos + "</div>" +
    (r.description ? '<p class="entradilla" style="margin-top:24px">' + esc(r.description) + "</p>" : "") +
    '<div class="acciones" style="justify-content:flex-start;margin-top:30px">' +
      (pts.length ? '<a class="boton boton-principal" id="bajar" href="#">⬇ Descargar GPX</a>' : "") +
      '<a class="boton boton-suave" href="motoclubes://ruta/' + esc(r.id) + '">Abrir en la app</a>' +
      '<a class="boton boton-suave" href="../#descarga">No tengo la app</a>' +
    "</div>" +
    '<p class="aviso-beta" style="margin:18px 0 60px">El GPX se descarga sin cuenta y sin registro. ' +
    'Para navegarla con indicaciones, rodarla en grupo y hablar por el intercom, hace falta la app.</p>';

  mapaReal(r, pts); // WEB-RUTA-MAPA-1

  var b = document.getElementById("bajar");
  if (b) b.addEventListener("click", function (e) {
    e.preventDefault();
    var blob = new Blob([construirGpx(r, pts)], { type: "application/gpx+xml" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (r.title || "ruta").replace(/[^\w\sáéíóúñÁÉÍÓÚÑ-]/g, "").trim().replace(/\s+/g, "_") + ".gpx";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });
}

if (!id || !/^[0-9a-f-]{36}$/i.test(id)) {
  fallo("No hay ninguna ruta en este enlace.");
} else {
  fetch(SB_URL + "/rest/v1/rpc/mc_ruta_publica", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY },
    body: JSON.stringify({ p_id: id })
  })
    .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(function (r) {
      if (!r || !r.id) { fallo("Esta ruta no está disponible."); return; }
      document.title = r.title + " · MOTOCLUBes";
      pintar(r);
    })
    .catch(function () { fallo("No hemos podido cargar la ruta."); });
}
</script>
<script src="/assets/visita.js" defer></script>
