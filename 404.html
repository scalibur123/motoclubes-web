<script>
  // PLANIFICADOR-WEB-1 (121.ª, 23-oct-2026). GitHub Pages da esta página para cualquier dirección que no es un fichero.
  // Las de la app (www.motoclubes.es/planificar/app/rutas/123, /planificar/login al volver de Google…) se devuelven a la app
  // con ?ir=, y la app pone otra vez la dirección de verdad (src/router.tsx, volverDeLa404). El #… de Google se conserva.
  (function () {
    var p = location.pathname;
    if (p.indexOf("/planificar/") === 0 && p.length > "/planificar/".length) {
      var ir = p.slice("/planificar".length) + location.search;
      location.replace("/planificar/?ir=" + encodeURIComponent(ir) + location.hash);
    }
  })();
</script>
