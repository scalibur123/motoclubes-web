<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>MOTOCLUBes · SOS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:#111;color:#fff;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px}
.top{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.marca img{width:36px;height:36px;border-radius:10px}
.marca span{color:#FF7A1A}
select.idioma{background:#1c1c1c;color:#fff;border:1px solid #333;border-radius:10px;padding:8px 10px;font-family:inherit;font-size:14px}
.card{width:100%;max-width:440px}
h1{font-size:25px;font-weight:800;letter-spacing:-0.4px;line-height:1.2;margin-bottom:10px}
p{font-size:15.5px;line-height:1.6;color:rgba(255,255,255,0.78);margin-bottom:12px}
p.pie{font-size:12.5px;color:rgba(255,255,255,0.5);line-height:1.55}
p.pie a{color:rgba(255,255,255,0.7)}
.caja{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:14px 16px;margin:14px 0}
label.casilla{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.45;cursor:pointer;font-weight:700}
label.casilla input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:#FF7A1A}
label.campo{display:block;font-size:13px;color:rgba(255,255,255,0.6);margin:14px 0 6px}
input.texto{width:100%;background:#1c1c1c;border:1px solid #333;border-radius:12px;color:#fff;font-family:inherit;font-size:16px;padding:13px 14px}
button{font-family:inherit;cursor:pointer}
button.primario{width:100%;border:none;border-radius:999px;background:#FF7A1A;color:#111;font-weight:800;font-size:16.5px;padding:15px;margin-top:16px}
button.primario:disabled{opacity:.45;cursor:default}
button.secundario{width:100%;border:1px solid #444;border-radius:999px;background:transparent;color:#fff;font-weight:700;font-size:15px;padding:13px;margin-top:10px}
button.enlace{background:none;border:none;color:rgba(255,255,255,0.6);text-decoration:underline;font-size:14px;margin-top:18px}
.msg{font-size:14px;color:#ff7b7b;min-height:20px;margin-top:10px}
.hidden{display:none !important}
.sello{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:16px}
.sello.ok{background:rgba(124,255,155,0.14)}
.sello.sos{background:#DC2626;font-size:17px;font-weight:900;letter-spacing:.5px}
.rojo{background:#DC2626;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.rojo h1{margin-bottom:4px}
.rojo p{color:#fff;margin:0;font-size:14.5px}
.verde{background:#15803D;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.verde h1{margin-bottom:4px}
.verde p{color:#fff;margin:0;font-size:14.5px}
#mapa{width:100%;height:320px;border-radius:16px;overflow:hidden;background:#1a1a1a;margin-bottom:12px}
a.boton{display:block;text-align:center;text-decoration:none;border-radius:999px;font-weight:800;font-size:16px;padding:14px;margin-top:10px}
a.boton.llamar{background:#16A34A;color:#fff}
a.boton.maps{background:#fff;color:#111}
a.boton.e112{background:transparent;color:#fff;border:2px solid #DC2626}
.dato{font-size:13.5px;color:rgba(255,255,255,0.6);margin-bottom:10px}
</style>
</head>
<body>
<div class="top">
  <div class="marca"><img src="https://www.motoclubes.es/email-logo-helmet.png" alt=""><div>MOTO<span>CLUBes</span></div></div>
  <select class="idioma" id="idioma" aria-label="Idioma">
    <option value="es">Español</option><option value="ca">Català</option><option value="en">English</option>
    <option value="fr">Français</option><option value="pt">Português</option><option value="it">Italiano</option>
  </select>
</div>

<!-- CARGANDO -->
<div id="v-cargando" class="card"><h1 data-t="cargando"></h1></div>

<!-- ENLACE NO VÁLIDO -->
<div id="v-malo" class="card hidden"><h1 data-t="malo_t"></h1><p data-t="malo_p"></p></div>

<!-- CONTACTO · PENDIENTE: aceptar o no -->
<div id="v-pendiente" class="card hidden">
  <h1 id="pen-t"></h1>
  <p id="pen-p1"></p>
  <p data-t="pen_p2"></p>
  <div class="caja"><label class="casilla"><input type="checkbox" id="casilla"><span id="pen-casilla"></span></label></div>
  <label class="campo" for="tel" data-t="tel_l"></label>
  <input class="texto" id="tel" type="tel" inputmode="tel" maxlength="20" placeholder="+34 600 000 000" autocomplete="tel">
  <button class="primario" id="b-aceptar" disabled data-t="aceptar"></button>
  <button class="secundario" id="b-no" data-t="no_gracias"></button>
  <p class="msg" id="pen-msg"></p>
  <p class="pie" id="pen-legal"></p>
</div>

<!-- CONTACTO · ACEPTADO -->
<div id="v-aceptado" class="card hidden">
  <div class="sello ok">✓</div>
  <h1 id="ace-t"></h1>
  <p id="ace-p1"></p>
  <p data-t="ace_p2"></p>
  <label class="campo" for="tel2" data-t="tel_l"></label>
  <input class="texto" id="tel2" type="tel" inputmode="tel" maxlength="20" placeholder="+34 600 000 000" autocomplete="tel">
  <button class="secundario" id="b-guardar" data-t="guardar_tel"></button>
  <p class="msg" id="ace-msg"></p>
  <button class="enlace" id="b-dejar"></button>
</div>

<!-- CONTACTO · HA DICHO QUE NO / HA DEJADO DE SERLO -->
<div id="v-rechazado" class="card hidden">
  <h1 data-t="rec_t"></h1>
  <p id="rec-p"></p>
</div>

<!-- SOS · EL MAPA -->
<div id="v-sos" class="card hidden">
  <div id="sos-cartel" class="rojo"><h1 id="sos-t"></h1><p id="sos-sub"></p></div>
  <div id="mapa"></div>
  <p class="dato" id="sos-dato"></p>
  <a class="boton llamar hidden" id="sos-llamar"></a>
  <a class="boton e112" href="tel:112" data-t="llamar_112"></a>
  <a class="boton maps" id="sos-maps" target="_blank" rel="noopener" data-t="abrir_maps"></a>
  <p class="pie" style="margin-top:16px" data-t="sos_pie"></p>
</div>

      legal: "MOTOCLUBES TECH, S.L. conserva il tuo nome e la tua e-mail (e il tuo telefono, se lo lasci) perché {rider} ti ha indicato come contatto di emergenza. Li usiamo solo per avvisarti se chiede aiuto. Non ti invieremo pubblicità e non li cederemo a nessuno. Puoi smettere di essere contatto in qualsiasi momento dal link di ogni e-mail, e i tuoi dati vengono cancellati. Maggiori informazioni e diritti: {priv} · soporte@motoclubes.es",
      priv: "Informativa sulla privacy",
      ace_t: "Sei contatto di emergenza di {rider}", ace_p1: "Se {rider} chiede aiuto da MOTOCLUBes, riceverai un'e-mail da «MOTOCLUBes Emergencias» con un link per vedere dove si trova.",
      ace_p2: "Per vederla subito, salva sos@notify.motoclubes.es tra i tuoi contatti e, se una nostra e-mail finisce nello spam, segnala che «non è spam».",
      dejar: "Non essere più contatto di {rider}", dejar_seguro: "Sei sicuro? Non riceverai più i suoi avvisi di aiuto e cancelleremo i tuoi dati.", guardado: "Salvato.",
      rec_t: "Fatto", rec_p: "Non sei contatto di emergenza e abbiamo cancellato la tua e-mail. Non ti scriveremo più per questo.",
      err_tel: "Questo numero non sembra valido. Solo cifre, con il prefisso se vuoi (+34…).", err: "Non è stato possibile. Riprova.",
      sos_t: "{rider} ha chiesto aiuto", sos_sub: "Da MOTOCLUBes, {cuando}.", bien_t: "{rider} sta bene", bien_sub: "Lo ha comunicato {cuando}. Non devi fare nulla.",
      dato: "Ultima posizione: {cuando}.", llamar: "Chiama {rider}", abrir_maps: "Come arrivare", llamar_112: "Chiama il 112",
      sos_pie: "Prova a chiamare. Se non risponde o pensi che sia grave, chiama il 112 e indica dove si trova. Questa pagina si aggiorna da sola.",
      ahora: "proprio ora", hace_min: "{n} min fa", hace_h: "{n} h fa", a_las: "alle {h}" }
  };
  var PRIV = { es: "/legal/privacidad/", ca: "/legal/privacidad/", en: "/legal/privacidad/", fr: "/legal/privacidad/", pt: "/legal/privacidad/", it: "/legal/privacidad/" };

  var q = new URLSearchParams(location.search);
  var C = q.get("c"), S = q.get("s");
  var esLlave = function (x) { return typeof x === "string" && /^[0-9a-f]{64}$/.test(x); };
  var idioma = (function () {
    var l = (q.get("l") || "").toLowerCase();
    if (T[l]) return l;
    var n = (navigator.languages || [navigator.language || "es"]);
    for (var i = 0; i < n.length; i++) { var c = String(n[i]).toLowerCase().slice(0, 2); if (T[c]) return c; }
    return "es";
  })();
  var elegido = !!T[(q.get("l") || "").toLowerCase()];

  var $ = function (id) { return document.getElementById(id); };
  function t(k, v) {
    var s = (T[idioma] && T[idioma][k]) || T.es[k] || "";
    if (v) s = s.replace(/\{(\w+)\}/g, function (m, n) { return n in v ? v[n] : m; });
    return s;
  }
  var vistas = ["cargando", "malo", "pendiente", "aceptado", "rechazado", "sos"];
  var vistaActual = "cargando";
  function ver(n) { vistaActual = n; vistas.forEach(function (v) { $("v-" + v).classList.toggle("hidden", v !== n); }); }

  var datos = null;   // lo último que dijo el servidor
  function pintar() {
    document.documentElement.lang = idioma;
    $("idioma").value = idioma;
    document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = t(e.getAttribute("data-t")); });
    if (!datos) return;
    var r = { rider: datos.rider || "" };
    if (C) {
      $("pen-t").textContent = t("pen_t", r);
      $("pen-p1").textContent = t("pen_p1", r);
      $("pen-casilla").textContent = t("casilla", r);
      var legal = $("pen-legal"); legal.textContent = "";
      var trozos = t("legal", r).split("{priv}");
      legal.appendChild(document.createTextNode(trozos[0]));
      var a = document.createElement("a"); a.href = PRIV[idioma]; a.target = "_blank"; a.rel = "noopener"; a.textContent = t("priv");
      legal.appendChild(a);
      legal.appendChild(document.createTextNode(trozos[1] || ""));
      $("ace-t").textContent = t("ace_t", r);
      $("ace-p1").textContent = t("ace_p1", r);
      $("b-dejar").textContent = t("dejar", r);
      $("rec-p").textContent = t("rec_p");
    } else if (S) pintarSos();
  }

  $("idioma").addEventListener("change", function (e) { idioma = e.target.value; elegido = true; pintar(); });

  function pedir(metodo, cuerpo) {
    var url = API + (metodo === "GET" ? "?" + (C ? "c=" + C : "s=" + S) : "");
    var o = { method: metodo, headers: { "Content-Type": "application/json" } };
    if (cuerpo) o.body = JSON.stringify(cuerpo);
    return fetch(url, o).then(function (x) { return x.json().then(function (d) { return { s: x.status, d: d }; }); });
  }

  // ───────────── contacto ─────────────
  function entrarContacto() {
    pedir("GET").then(function (res) {
      if (res.s !== 200 || !res.d.ok) { ver("malo"); return; }
      datos = res.d;
      if (!elegido && T[datos.idioma]) idioma = datos.idioma;
      pintar();
      ver(datos.estado === "aceptado" ? "aceptado" : datos.estado === "pendiente" ? "pendiente" : "rechazado");
    }).catch(function () { ver("malo"); });
  }
  function responder(acepta, tel, msg, boton) {
    msg.textContent = "";
    if (boton) boton.disabled = true;
    return pedir("POST", { c: C, acepta: acepta, telefono: tel || null, idioma: idioma }).then(function (res) {
      if (boton) boton.disabled = false;
      if (res.s === 200 && res.d.ok) return res.d.estado;
      msg.textContent = t(res.d && res.d.error === "telefono" ? "err_tel" : "err");
      return null;
    }).catch(function () { if (boton) boton.disabled = false; msg.textContent = t("err"); return null; });
  }
  $("casilla").addEventListener("change", function (e) { $("b-aceptar").disabled = !e.target.checked; });
  $("b-aceptar").addEventListener("click", function () {
    if (!$("casilla").checked) return;
    responder(true, $("tel").value.trim(), $("pen-msg"), $("b-aceptar")).then(function (e) {
      if (e === "aceptado") { $("tel2").value = $("tel").value.trim(); ver("aceptado"); window.scrollTo(0, 0); }
      else $("b-aceptar").disabled = !$("casilla").checked;
    });
  });
  $("b-no").addEventListener("click", function () {
    responder(false, null, $("pen-msg"), $("b-no")).then(function (e) { if (e === "rechazado") { ver("rechazado"); window.scrollTo(0, 0); } });
  });
  $("b-guardar").addEventListener("click", function () {
    responder(true, $("tel2").value.trim(), $("ace-msg"), $("b-guardar")).then(function (e) {
      if (e === "aceptado") { $("ace-msg").style.color = "#7CFF9B"; $("ace-msg").textContent = t("guardado"); }
      else $("ace-msg").style.color = "";
    });
  });
  $("b-dejar").addEventListener("click", function () {
    if (!window.confirm(t("dejar_seguro"))) return;
    responder(false, null, $("ace-msg"), $("b-dejar")).then(function (e) { if (e === "rechazado") { ver("rechazado"); window.scrollTo(0, 0); } });
  });

  // ───────────── SOS ─────────────
  var mapa = null, marca = null, desfase = 0;
  function cuando(iso) {
    var d = new Date(iso), ahora = Date.now() + desfase;
    var min = Math.max(0, Math.round((ahora - d.getTime()) / 60000));
    var h = d.toLocaleTimeString(idioma === "en" ? "en-GB" : idioma, { hour: "2-digit", minute: "2-digit" });
    if (min < 1) return t("ahora");
    if (min < 60) return t("hace_min", { n: min }) + " (" + t("a_las", { h: h }) + ")";
    if (min < 24 * 60) return t("hace_h", { n: Math.round(min / 60) }) + " (" + t("a_las", { h: h }) + ")";
    return d.toLocaleString(idioma === "en" ? "en-GB" : idioma);
  }
  function pintarSos() {
    if (!datos) return;
    var r = { rider: datos.rider || "" };
    var bien = !!datos.bien_at;
    $("sos-cartel").className = bien ? "verde" : "rojo";
    $("sos-t").textContent = (bien ? "✅ " : "🆘 ") + t(bien ? "bien_t" : "sos_t", r);
    $("sos-sub").textContent = t(bien ? "bien_sub" : "sos_sub", { cuando: cuando(bien ? datos.bien_at : datos.creado_at) });
    $("sos-dato").textContent = t("dato", { cuando: cuando(datos.actualizado_at) });
    $("sos-maps").href = "https://www.google.com/maps/dir/?api=1&destination=" + datos.lat + "," + datos.lng;
    var ll = $("sos-llamar");
    if (datos.telefono) { ll.href = "tel:" + datos.telefono; ll.textContent = "📞 " + t("llamar", r); ll.classList.remove("hidden"); }
    else ll.classList.add("hidden");
    document.title = (bien ? "✅ " : "🆘 ") + (datos.rider || "SOS") + " · MOTOCLUBes";
    try {
      if (!mapa && window.mapboxgl) {
        mapboxgl.accessToken = MAPBOX_TOKEN;
        mapa = new mapboxgl.Map({ container: "mapa", style: "mapbox://styles/mapbox/outdoors-v12", center: [datos.lng, datos.lat], zoom: 14, attributionControl: true });
        mapa.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");
        var el = document.createElement("div");
        el.style.cssText = "width:40px;height:40px;border-radius:50%;background:#DC2626;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.45);color:#fff;font:900 12px system-ui;display:flex;align-items:center;justify-content:center";
        el.textContent = "SOS";
        marca = new mapboxgl.Marker({ element: el, anchor: "center" }).setLngLat([datos.lng, datos.lat]).addTo(mapa);
      } else if (marca) {
        marca.setLngLat([datos.lng, datos.lat]);
        marca.getElement().style.background = bien ? "#15803D" : "#DC2626";
      }
    } catch (e) { /* sin mapa: quedan la hora y el botón de Google Maps */ }
  }
  var ultimoPunto = "";
  function entrarSos(primera) {
    pedir("GET").then(function (res) {
      if (res.s !== 200 || !res.d.ok) { if (primera) ver("malo"); return; }
      datos = res.d;
      if (datos.ahora) desfase = new Date(datos.ahora).getTime() - Date.now();
      pintar();
      if (vistaActual !== "sos") ver("sos");
      var p = datos.lat + "," + datos.lng;
      if (mapa && p !== ultimoPunto && ultimoPunto) { try { mapa.easeTo({ center: [datos.lng, datos.lat] }); } catch (e) {} }
      ultimoPunto = p;
      if (primera && mapa) { try { mapa.resize(); } catch (e) {} }
    }).catch(function () { if (primera) ver("malo"); });
  }

  pintar();
  if (esLlave(C)) { S = null; entrarContacto(); }
  else if (esLlave(S)) { C = null; entrarSos(true); setInterval(function () { if (!document.hidden) entrarSos(false); }, 30000); document.addEventListener("visibilitychange", function () { if (!document.hidden) entrarSos(false); }); }
  else ver("malo");
})();
</script>
</body>
</html>
